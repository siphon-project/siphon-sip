      - sh
      - -c
      - "cp /src/package.json /src/webrtc_test.js /app/ && npm install --no-audit --no-fund --loglevel=error && node webrtc_test.js"
    networks:
      sipnet:
        ipv4_address: 172.20.0.83
    profiles:
      - webrtc

  # ── Proxy-mode REFER (passthrough via loose-routing) ─────────────────────
  # Reuses the base `siphon` proxy (172.20.0.10, proxy_default.py, which
  # record-routes and loose-routes in-dialog requests). Proves an in-dialog
  # REFER on a proxy dialog is loose-routed to the far end exactly once
  # (never proxy-relayed by R-URI into a loop) and the far end's 202 + sipfrag
  # NOTIFYs relay straight back. No B2BUA, no siphon-side subscription state.

  # Register bob from the UAS IP so the proxy routes the INVITE to him.
  sipp-proxy-refer-register:
    image: ctaloi/sipp:latest
    depends_on:
      siphon:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.70
    entrypoint:
      - sipp
      - "172.20.0.10:5060"
      - -sf
      - /sipp/scenarios/register.xml
      - -s
      - bob
      - -ap
      - secret
      - -m
      - "1"
      - -timeout
      - "10"
    profiles:
      - proxy-refer

  # Bob, the transferee/far end.
  sipp-proxy-refer-uas:
    image: ctaloi/sipp:latest
    depends_on:
      sipp-proxy-refer-register:
        condition: service_completed_successfully
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.70
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/proxy_refer_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - proxy-refer

  # Alice, the referrer.
  sipp-proxy-refer-uac:
    image: ctaloi/sipp:latest
    depends_on:
      siphon:
        condition: service_healthy
      sipp-proxy-refer-uas:
        condition: service_started
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.71
    entrypoint:
      - sipp
      - "172.20.0.10:5060"
      - -sf
      - /sipp/scenarios/proxy_refer_uac.xml
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - proxy-refer

  # ── Anchored REFER-terminate against a REAL rtpengine ────────────────────
  # Proves the terminate-transfer media recipe (siphon issues rtpengine
  # offer/answer/delete to re-anchor survivor↔target on a fresh media session
  # and tears down the old anchor) end-to-end against a real media engine, not
  # the SDP-echo mock. Alice(.53) calls bob(.52) through the anchored B2BUA
  # siphon(.61); the SDP is rewritten to rtpengine(.44); Alice REFERs to
  # carol(.54); siphon re-anchors bob↔carol and BYEs alice.

  rtpengine-real:
    image: drachtio/rtpengine:latest
    container_name: rtpengine-real
    # Entrypoint auto-detects the container IP → interface + listen-ng=IP:22222.
    # --table=-1 forces userspace forwarding (no kernel module in the container).
    command: ["rtpengine", "--table=-1", "--log-level=6"]
    networks:
      sipnet:
        ipv4_address: 172.20.0.44
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'hc d7:command4:pinge', ('172.20.0.44',22222)); d=s.recv(1024); s.close(); exit(0 if b'pong' in d else 1)\" || nc -zu 172.20.0.44 22222"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    profiles:
      - b2bua-rtpengine-refer

  siphon-b2bua-rtpengine-refer:
    build:
      context: ..
    container_name: siphon-b2bua-rtpengine-refer-test
    depends_on:
      rtpengine-real:
        condition: service_started
    volumes:
      - ./configs/siphon.b2bua-rtpengine-refer.yaml:/etc/siphon/siphon.yaml:ro
      - ../scripts:/etc/siphon/scripts:ro
      - ../examples:/etc/siphon/examples:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.61
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'OPTIONS sip:siphon.test SIP/2.0\\r\\nVia: SIP/2.0/UDP 127.0.0.1:15060;branch=z9hG4bK-hc\\r\\nFrom: <sip:hc@siphon.test>;tag=hc\\r\\nTo: <sip:siphon.test>\\r\\nCall-ID: hc@check\\r\\nCSeq: 1 OPTIONS\\r\\nMax-Forwards: 1\\r\\nContent-Length: 0\\r\\n\\r\\n', ('127.0.0.1',5060)); s.recv(1024); s.close()\""]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    profiles:
      - b2bua-rtpengine-refer

  sipp-anchored-refer-register:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-b2bua-rtpengine-refer:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.52
    entrypoint:
      - sipp
      - "172.20.0.61:5060"
      - -sf
      - /sipp/scenarios/register.xml
      - -s
      - bob
      - -ap
      - secret
      - -m
      - "1"
      - -timeout
      - "10"
    profiles:
      - b2bua-rtpengine-refer

  sipp-anchored-refer-bob-uas:
    image: ctaloi/sipp:latest
    depends_on:
      sipp-anchored-refer-register:
        condition: service_completed_successfully
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.52
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/b2bua_refer_terminate_bob_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - b2bua-rtpengine-refer

  sipp-anchored-refer-carol-uas:
    image: ctaloi/sipp:latest
    depends_on:
      sipp-anchored-refer-register:
        condition: service_completed_successfully
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.54
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/b2bua_refer_carol_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - b2bua-rtpengine-refer

  sipp-anchored-refer-uac:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-b2bua-rtpengine-refer:
        condition: service_healthy
      sipp-anchored-refer-bob-uas:
        condition: service_started
      sipp-anchored-refer-carol-uas:
        condition: service_started
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.53
    entrypoint:
      - sipp
      - "172.20.0.61:5060"
      - -sf
      - /sipp/scenarios/b2bua_refer_terminate_uac.xml
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - b2bua-rtpengine-refer

  # ── Charging: real CGRateS OCS/CDF (profile: charging) ─────────────────────
  # Rf + Ro against a real go-diameter peer. Requires docker; opt-in like ipsec.
  #   docker compose -f sipp/docker-compose.yaml --profile charging up -d cgrates siphon-charging
  #   scripts/charging_test.sh
  cgrates:
    image: cgrates/cgrates:latest
    container_name: cgrates-charging
    command: ["cgr-engine", "-config_path", "/etc/cgrates"]
    volumes:
      - ./cgrates/cgrates.json:/etc/cgrates/cgrates.json:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.70
    healthcheck:
      test: ["CMD-SHELL", "cgr-console 'status' >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 8s
    profiles:
      - charging

  siphon-charging:
    image: sipp-siphon
    container_name: siphon-charging
    depends_on:
      cgrates:
        condition: service_healthy
    volumes:
      - ./configs/siphon.charging-test.yaml:/etc/siphon/siphon.yaml:ro
      - ../scripts:/etc/siphon/scripts:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.71
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'OPTIONS sip:siphon.test SIP/2.0\\r\\nVia: SIP/2.0/UDP 127.0.0.1:15060;branch=z9hG4bK-hc\\r\\nFrom: <sip:hc@siphon.test>;tag=hc\\r\\nTo: <sip:siphon.test>\\r\\nCall-ID: hc@check\\r\\nCSeq: 1 OPTIONS\\r\\nMax-Forwards: 1\\r\\nContent-Length: 0\\r\\n\\r\\n', ('127.0.0.1',5060)); s.recv(1024); s.close()\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 12s
    profiles:
      - charging

  # Register bob FROM the UAS IP (.73) so the B2BUA forks over the captured
  # inbound flow to where the UAS actually listens (same pattern as sipp-b2bua-register).
  sipp-charging-register:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-charging:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.73
    entrypoint:
      - sipp
      - "172.20.0.71:5060"
      - -sf
      - /sipp/scenarios/register_alice_contact.xml
      - -inf
      - /sipp/scenarios/b2bua_bob_contact.csv
      - -s
      - bob
      - -ap
      - secret
      - -m
      - "1"
      - -timeout
      - "10"
    profiles:
      - charging

  sipp-charging-uas:
    image: ctaloi/sipp:latest
    depends_on:
      sipp-charging-register:
        condition: service_completed_successfully
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.73
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/b2bua_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "60"
      - -trace_err
    profiles:
      - charging

  # Happy path: prepaid balance sufficient → call completes (CCR-I/U/T + CDR).
  sipp-charging-uac:
    image: ctaloi/sipp:latest
    depends_on:
      sipp-charging-uas:
        condition: service_started
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.74
    entrypoint:
      - sipp
      - "172.20.0.71:5060"
      - -sf
      - /sipp/scenarios/charging_uac.xml
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "60"
      - -trace_err
    profiles:
      - charging

  # Enforcement: balance = 0 → siphon must BYE the call. sipp exits non-zero if
  # the BYE never arrives, which is the gate.
  sipp-charging-deny-uac:
    image: ctaloi/sipp:latest
    depends_on:
      sipp-charging-uas:
        condition: service_started
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.75
    entrypoint:
      - sipp
      - "172.20.0.71:5060"
      - -sf
      - /sipp/scenarios/charging_deny_uac.xml
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - charging

  # ── Route self-identity (RFC 3261 §16.4) ─────────────────────────────────
  # A proxy must consume the Route that "indicates this proxy" — the one it put
  # into Record-Route itself — and only that one.  siphon.routing-test.yaml
  # removes the IP from `domain.local` (leaving only the served domain, as a
  # real deployment does) and adds a SECOND udp listener on :5070, which the
  # dispatcher's first-per-transport maps cannot see.  The call runs against
  # :5070, so the Record-Route siphon stamps carries a host/port an incomplete
  # self-identity fails to match — and the in-dialog BYE is then refused.
  #
  # No header inspection needed: the UAC scenario waits for a 200 to its BYE,
  # so a refused self-Route fails the scenario and the container exits non-zero.
  siphon-routing:
    image: sipp-siphon
    build:
      context: ..
    container_name: siphon-routing-test
    volumes:
      - ./configs/siphon.routing-test.yaml:/etc/siphon/siphon.yaml:ro
      - ../scripts:/etc/siphon/scripts:ro
      - ../examples:/etc/siphon/examples:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.70
    healthcheck:
      # Probe the SECOND listener — proves both are actually bound.
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'OPTIONS sip:siphon.test SIP/2.0\\r\\nVia: SIP/2.0/UDP 127.0.0.1:15060;branch=z9hG4bK-hc\\r\\nFrom: <sip:hc@siphon.test>;tag=hc\\r\\nTo: <sip:siphon.test>\\r\\nCall-ID: hc@check\\r\\nCSeq: 1 OPTIONS\\r\\nMax-Forwards: 1\\r\\nContent-Length: 0\\r\\n\\r\\n', ('127.0.0.1',5070)); s.recv(1024); s.close()\""]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    profiles:
      - routing

  # Register bob with a Contact pointing at the routing UAS (172.20.0.72).
  sipp-routing-register:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-routing:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.72
    entrypoint:
      - sipp
      - "172.20.0.70:5070"
      - -sf
      - /sipp/scenarios/register.xml
      - -s
      - bob
      - -au
      - bob
      - -ap
      - secret
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - routing

  # invite_uas.xml (not _fast): it echoes [last_Record-Route:] into its 180/200
  # per RFC 3261 §12.1.1, so the UAC learns a real route set and the in-dialog
  # ACK and BYE come back Route-headed. That round trip is the whole point.
  sipp-routing-uas:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-routing:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.72
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/invite_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - routing

  # The verdict. invite_uac.xml uses rrs="true" + [routes], so its ACK and BYE
  # carry the route set siphon advertised. It waits for a 200 to the BYE — which
  # only arrives if siphon consumed its own Record-Route and relayed onward.
  sipp-routing-uac:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-routing:
        condition: service_healthy
      sipp-routing-uas:
        condition: service_started
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.73
    entrypoint:
      - sipp
      - "172.20.0.70:5070"
      - -sf
      - /sipp/scenarios/routing_uac.xml
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - routing

  # ── Terminating failover across an AoR's bindings ───────────────────────────
  # Two acceptance scenarios on one fixture (scripts/failover_proxy.py):
  #
  #  1. Per-binding Path routing.  bob registers twice with different RFC 3327
  #     Path tokens (edge .90 and edge .91).  Edge .90 answers 404 (its binding
  #     is gone); the sequential fork's second branch must be routed by binding
  #     B's OWN Path and reach edge .91, which answers 200.  If branches share
  #     branch 0's route set, .91 is never reached and the caller gets the 404.
  #
  #  2. Failure re-targeting on a single-destination relay.  carol's backend
  #     (.95) answers 503, then 486, then 200.  There is no fork, so this only
  #     works if @proxy.on_failure fires for a plain relay AND its
  #     request.relay() actually re-sends.
  #
  # Driver: scripts/failover_test.sh

  siphon-failover:
    image: sipp-siphon
    build:
      context: ..
    container_name: siphon-failover
    volumes:
      - ./configs/siphon.failover-test.yaml:/etc/siphon/siphon.yaml:ro
      - ../scripts:/etc/siphon/scripts:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.13
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'OPTIONS sip:siphon.test SIP/2.0\\r\\nVia: SIP/2.0/UDP 127.0.0.1:15060;branch=z9hG4bK-hc\\r\\nFrom: <sip:hc@siphon.test>;tag=hc\\r\\nTo: <sip:siphon.test>\\r\\nCall-ID: hc@check\\r\\nCSeq: 1 OPTIONS\\r\\nMax-Forwards: 1\\r\\nContent-Length: 0\\r\\n\\r\\n', ('127.0.0.1',5060)); s.recv(1024); s.close()\""]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    profiles:
      - failover

  # bob's first binding — Path token resolves to edge .90, q=1.0 so the
  # sequential fork tries it first.
  sipp-failover-register-a:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-failover:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.92
    entrypoint:
      - sipp
      - "172.20.0.13:5060"
      - -sf
      - /sipp/scenarios/failover_register_path.xml
      - -s
      - bob
      - -key
      - regpath
      - "<sip:token-a@172.20.0.90:5060;lr>"
      - -key
      - regq
      - "1.0"
      - -m
      - "1"
      - -timeout
      - "10"
      - -trace_err
    profiles:
      - failover

  # bob's second binding — Path token resolves to edge .91, q=0.5 so it is the
  # failover branch, not the first one tried.
  sipp-failover-register-b:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-failover:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.93
    entrypoint:
      - sipp
      - "172.20.0.13:5060"
      - -sf
      - /sipp/scenarios/failover_register_path.xml
      - -s
      - bob
      - -key
      - regpath
      - "<sip:token-b@172.20.0.91:5060;lr>"
      - -key
      - regq
      - "0.5"
      - -m
      - "1"
      - -timeout
      - "10"
      - -trace_err
    profiles:
      - failover

  sipp-failover-reject:
    image: ctaloi/sipp:latest
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.90
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/failover_reject_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - failover

  sipp-failover-answer:
    image: ctaloi/sipp:latest
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.91
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/failover_answer_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - failover

  # carol's primary backend — rejects, so on_failure has to re-target.
  sipp-failover-backend-primary:
    image: ctaloi/sipp:latest
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.95
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/failover_reject_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - failover

  # carol's backup backend — only reachable via the on_failure retarget.
  sipp-failover-backend-backup:
    image: ctaloi/sipp:latest
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.97
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/failover_answer_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - failover

  sipp-failover-uac:
    image: ctaloi/sipp:latest
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.94
    entrypoint:
      - sipp
      - "172.20.0.13:5060"
      - -sf
      - /sipp/scenarios/failover_uac.xml
      - -s
      - bob
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "40"
      - -timeout_error
      - -trace_err
    profiles:
      - failover

  sipp-failover-retarget-uac:
    image: ctaloi/sipp:latest
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.96
    entrypoint:
      - sipp
      - "172.20.0.13:5060"
      - -sf
      - /sipp/scenarios/failover_uac.xml
      - -s
      - carol
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "40"
      - -timeout_error
      - -trace_err
    profiles:
      - failover

  # ── A forwarding transport error must become a response ────────────────────
  # siphon relays an INVITE over TCP to a host that is up but listening on
  # nothing, so the pool's connect is refused immediately.  RFC 3261 §16.9 makes
  # that a 503 on the branch and §16.7 step 6 forwards it upstream as a 500.
  # Before that was wired the branch went silent and the caller sat on its
  # `100 Trying` until its own Timer F (32 s).
  #
  # Driver: scripts/transport_error_test.sh

  siphon-transport-error:
    image: sipp-siphon
    build:
      context: ..
    container_name: siphon-transport-error
    volumes:
      - ./configs/siphon.transport-error-test.yaml:/etc/siphon/siphon.yaml:ro
      - ../scripts:/etc/siphon/scripts:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.14
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'OPTIONS sip:siphon.test SIP/2.0\\r\\nVia: SIP/2.0/UDP 127.0.0.1:15060;branch=z9hG4bK-hc\\r\\nFrom: <sip:hc@siphon.test>;tag=hc\\r\\nTo: <sip:siphon.test>\\r\\nCall-ID: hc@check\\r\\nCSeq: 1 OPTIONS\\r\\nMax-Forwards: 1\\r\\nContent-Length: 0\\r\\n\\r\\n', ('127.0.0.1',5060)); s.recv(1024); s.close()\""]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    profiles:
      - transport-error

  # Up, reachable, and listening on nothing — a TCP connect to :5060 is refused
  # at once.  An unassigned address would hang until a connect timeout instead,
  # which would test patience rather than the error path.
  transport-error-blackhole:
    image: alpine:3
    command: ["sleep", "600"]
    networks:
      sipnet:
        ipv4_address: 172.20.0.98
    profiles:
      - transport-error

  sipp-transport-error-uac:
    image: ctaloi/sipp:latest
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.99
    entrypoint:
      - sipp
      - "172.20.0.14:5060"
      - -sf
      - /sipp/scenarios/transport_error_uac.xml
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "20"
      - -timeout_error
      - -trace_err
    profiles:
      - transport-error

  # ── B2BUA: routing a binding through its RFC 3327 Path ──────────────────────
  # The B2BUA builds a FRESH B-leg INVITE, so none of the proxy-side Path work
  # applies to it.  Every scenario registers a binding whose Contact is somewhere
  # the call cannot be completed (172.20.0.200 — in-subnet, no container, so a
  # UDP send there is silently dropped exactly like a NATed or `.invalid`
  # contact), and points the Path at a live edge.  A B-leg that arrives at the
  # edge therefore proves it was routed by the route set, not the Contact URI.
  #
  #  1. bob      — parallel call.fork() over ONE binding.  Edge .84 answers 200.
  #  2. bobseq   — sequential call.fork() over TWO bindings with different Path
  #                tokens.  Edge .85 answers 404 (its binding is gone), so the
  #                second branch must be routed by binding B's OWN Path and
  #                reach edge .86.
  #  3. bobdial  — call.dial(uri, route=contact.path).  `route=` predates this
  #                fixture but only ever set the header.
  #  4. bobmtu   — parallel fork driven by an over-MTU INVITE, with the Contact
  #                host a resolvable DNS name (the decoy) holding a live TCP
  #                listener.  The §18.1.1 UDP→TCP re-probe must follow the same
  #                URI the destination came from; probing the Contact resolves
  #                the decoy and lands the B-leg there instead of the edge.
  #
  # Driver: scripts/b2bua_path_test.sh

  siphon-b2bua-path:
    image: sipp-siphon
    build:
      context: ..
    container_name: siphon-b2bua-path
    volumes:
      - ./configs/siphon.b2bua-path-test.yaml:/etc/siphon/siphon.yaml:ro
      - ../scripts:/etc/siphon/scripts:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.15
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'OPTIONS sip:siphon.test SIP/2.0\\r\\nVia: SIP/2.0/UDP 127.0.0.1:15060;branch=z9hG4bK-hc\\r\\nFrom: <sip:hc@siphon.test>;tag=hc\\r\\nTo: <sip:siphon.test>\\r\\nCall-ID: hc@check\\r\\nCSeq: 1 OPTIONS\\r\\nMax-Forwards: 1\\r\\nContent-Length: 0\\r\\n\\r\\n', ('127.0.0.1',5060)); s.recv(1024); s.close()\""]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    profiles:
      - b2bua-path

  # ── The registering UEs.  Each exits after its one REGISTER (-m 1), which is
  # also why the Contact must not be the sender's own address: these processes
  # are gone by the time the call arrives.

  # 1. bob — one binding, Path -> edge .84.
  sipp-b2bua-path-register-bob:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-b2bua-path:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.17
    entrypoint:
      - sipp
      - "172.20.0.15:5060"
      - -sf
      - /sipp/scenarios/b2bua_path_register.xml
      - -s
      - bob
      - -key
      - regcontact
      - "sip:bob@172.20.0.200:5060"
      - -key
      - regpath
      - "<sip:token-bob@172.20.0.84:5060;lr>"
      - -key
      - regq
      - "1.0"
      - -m
      - "1"
      - -timeout
      - "10"
      - -trace_err
    profiles:
      - b2bua-path

  # 2a. bobseq binding A — Path -> edge .85 (answers 404), q=1.0 so the
  #     sequential fork tries it first.
  sipp-b2bua-path-register-seq-a:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-b2bua-path:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.18
    entrypoint:
      - sipp
      - "172.20.0.15:5060"
      - -sf
      - /sipp/scenarios/b2bua_path_register.xml
      - -s
      - bobseq
      - -key
      - regcontact
      - "sip:bobseq@172.20.0.200:5060"
      - -key
      - regpath
      - "<sip:token-seq-a@172.20.0.85:5060;lr>"
      - -key
      - regq
      - "1.0"
      - -m
      - "1"
      - -timeout
      - "10"
      - -trace_err
    profiles:
      - b2bua-path

  # 2b. bobseq binding B — Path -> edge .86 (answers 200), q=0.5 so it is the
  #     failover branch, not the first one tried.
  sipp-b2bua-path-register-seq-b:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-b2bua-path:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.19
    entrypoint:
      - sipp
      - "172.20.0.15:5060"
      - -sf
      - /sipp/scenarios/b2bua_path_register.xml
      - -s
      - bobseq
      - -key
      - regcontact
      - "sip:bobseq@172.20.0.201:5060"
      - -key
      - regpath
      - "<sip:token-seq-b@172.20.0.86:5060;lr>"
      - -key
      - regq
      - "0.5"
      - -m
      - "1"
      - -timeout
      - "10"
      - -trace_err
    profiles:
      - b2bua-path

  # 3. bobdial — one binding, Path -> edge .84, dialled via call.dial(route=…).
  sipp-b2bua-path-register-dial:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-b2bua-path:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.38
    entrypoint:
      - sipp
      - "172.20.0.15:5060"
      - -sf
      - /sipp/scenarios/b2bua_path_register.xml
      - -s
      - bobdial
      - -key
      - regcontact
      - "sip:bobdial@172.20.0.200:5060"
      - -key
      - regpath
      - "<sip:token-dial@172.20.0.84:5060;lr>"
      - -key
      - regq
      - "1.0"
      - -m
      - "1"
      - -timeout
      - "10"
      - -trace_err
    profiles:
      - b2bua-path

  # 4. bobmtu — Contact host is the decoy's DNS NAME (resolvable, and holding a
  #    live TCP listener), Path -> the UDP-only edge .84.  This is the pair the
  #    §18.1.1 re-probe can get wrong: resolving the Contact finds a TCP path and
  #    replaces the destination, resolving the Route does not.
  sipp-b2bua-path-register-mtu:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-b2bua-path:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.48
    entrypoint:
      - sipp
      - "172.20.0.15:5060"
      - -sf
      - /sipp/scenarios/b2bua_path_register.xml
      - -s
      - bobmtu
      - -key
      - regcontact
      - "sip:bobmtu@sipp-b2bua-path-decoy:5060"
      - -key
      - regpath
      - "<sip:token-mtu@172.20.0.84:5060;lr>"
      - -key
      - regq
      - "1.0"
      - -m
      - "1"
      - -timeout
      - "10"
      - -trace_err
    profiles:
      - b2bua-path

  # ── The edges.  Reusing the failover fixture's UAS scenarios: identical roles
  # (one answers, one rejects) and the B-leg flow is the same INVITE/200/ACK/BYE.

  # Answers 180 + 200 — the edge for bob, bobdial and bobmtu.  UDP only, which is
  # what makes the MTU scenario's re-probe decision observable: there is no TCP
  # path here, so a correctly-probed over-MTU B-leg stays on UDP and still lands.
  sipp-b2bua-path-edge-answer:
    image: ctaloi/sipp:latest
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.84
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/failover_answer_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - b2bua-path

  # bobseq binding A's edge: answers 503, this edge is out of service.
  #
  # 503 and not the 404 the proxy-side failover fixture uses, because the B2BUA's
  # sequential strategy advances through the LCR route-sequence engine, and there
  # a 404 is deliberately NOT a reroute cause (`lcr::default_reroute_causes` —
  # definitive call outcomes are opt-in per carrier, so a 404 ends the call by
  # design).  The claim under test is which host each branch is SENT to, so the
  # fixture uses a default reroute cause rather than switching the policy on with
  # an `lcr.reroute_causes` knob that could mask the routing it is meant to prove.
  sipp-b2bua-path-edge-reject:
    image: ctaloi/sipp:latest
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.85
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/b2bua_lcr_carrier_a_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - b2bua-path

  # bobseq binding B's edge: reachable only if the failover branch was routed by
  # binding B's own Path.
  sipp-b2bua-path-edge-answer-b:
    image: ctaloi/sipp:latest
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.86
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/failover_answer_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - b2bua-path

  # The decoy: a TCP-ONLY listener at the DNS name bobmtu's Contact points at.
  # It exists so the wrong probe SUCCEEDS — a refused connect would keep the
  # B-leg on UDP and hide the bug.  It answers nothing, so a B-leg delivered here
  # fails the call as well as showing up in this container's log.
  sipp-b2bua-path-decoy:
    image: ctaloi/sipp:latest
    container_name: sipp-b2bua-path-decoy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.87
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/b2bua_path_decoy_tcp_uas.xml
      - -t
      - t1
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "60"
      - -trace_err
    profiles:
      - b2bua-path

  # The caller.  Demands a 200 — a 404/408/503 arriving instead is the failure
  # signal.  failover_uac.xml is reused for the three small-INVITE scenarios
  # (-s bob | bobseq | bobdial); the MTU one needs its own padded body.
  sipp-b2bua-path-uac:
    image: ctaloi/sipp:latest
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.16
    entrypoint:
      - sipp
      - "172.20.0.15:5060"
      - -sf
      - /sipp/scenarios/failover_uac.xml
      - -s
      - bob
      - -m
      - "1"
      - -timeout
      - "25"
      - -timeout_error
      - -trace_err
    profiles:
      - b2bua-path

  sipp-b2bua-path-uac-seq:
    image: ctaloi/sipp:latest
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.56
    entrypoint:
      - sipp
      - "172.20.0.15:5060"
      - -sf
      - /sipp/scenarios/failover_uac.xml
      - -s
      - bobseq
      - -m
      - "1"
      - -timeout
      - "25"
      - -timeout_error
      - -trace_err
    profiles:
      - b2bua-path

  sipp-b2bua-path-uac-dial:
    image: ctaloi/sipp:latest
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.57
    entrypoint:
      - sipp
      - "172.20.0.15:5060"
      - -sf
      - /sipp/scenarios/failover_uac.xml
      - -s
      - bobdial
      - -m
      - "1"
      - -timeout
      - "25"
      - -timeout_error
      - -trace_err
    profiles:
      - b2bua-path

  sipp-b2bua-path-uac-mtu:
    image: ctaloi/sipp:latest
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.49
    entrypoint:
      - sipp
      - "172.20.0.15:5060"
      - -sf
      - /sipp/scenarios/b2bua_path_oversized_uac.xml
      - -s
      - bobmtu
      - -m
      - "1"
      - -timeout
      - "25"
      - -timeout_error
      - -trace_err
    profiles:
      - b2bua-path

  # ── Voice-AI B2BUA (single-leg answer + WebSocket bridge) ─────────────────
  # Requires the "voice-ai" profile.
  #
  # IP assignments:
  #   172.20.0.103 — mock siphon-rtp control server
  #   172.20.0.104 — siphon (B2BUA)
  #   172.20.0.105 — carrier UAC
  #
  # Flow: UAC → siphon B2BUA (rtpengine.answer_local with ws_uri) → 200 OK
  # There is no UAS: siphon answers the call itself with the SDP the engine
  # synthesised, so the test asserts the answer is anchored on the engine's
  # media address rather than echoing the caller's own c= line back.
  #
  # The mock records every control command it receives, so the offer's
  # profile.ws_uri (placeholder-expanded) is visible in its logs.
  #
  # Usage:
  #   docker compose -f sipp/docker-compose.yaml --profile voice-ai \
  #     up --abort-on-container-exit sipp-voice-ai-uac

  # Mock siphon-rtp — native JSON-over-TCP control on 8080
  mock-siphon-rtp:
    image: python:3.12-slim
    container_name: mock-siphon-rtp
    volumes:
      - ./siphon-rtp:/app:ro
    working_dir: /app
    command: ["python3", "mock_siphon_rtp.py"]
    environment:
      SIPHON_RTP_PORT: "8080"
      MOCK_MEDIA_IP: "203.0.113.1"
      MOCK_MEDIA_PORT: "30000"
    networks:
      sipnet:
        ipv4_address: 172.20.0.103
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,struct,json; s=socket.create_connection(('127.0.0.1',8080),2); b=json.dumps({'id':1,'command':'ping'}).encode(); s.sendall(struct.pack('!I',len(b))+b); h=s.recv(4); n=struct.unpack('!I',h)[0]; d=s.recv(n); s.close(); exit(0 if b'pong' in d else 1)\""]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 3s
    profiles:
      - voice-ai

  # SIPhon B2BUA running examples/voice_ai_b2bua.py
  siphon-voice-ai:
    build:
      context: ..
    container_name: siphon-voice-ai-test
    depends_on:
      mock-siphon-rtp:
        condition: service_healthy
    volumes:
      - ./siphon-rtp/siphon-voice-ai.yaml:/etc/siphon/siphon.yaml:ro
      - ../scripts:/etc/siphon/scripts:ro
      - ../examples:/etc/siphon/examples:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.104
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'OPTIONS sip:siphon.test SIP/2.0\\r\\nVia: SIP/2.0/UDP 127.0.0.1:15060;branch=z9hG4bK-hc\\r\\nFrom: <sip:hc@siphon.test>;tag=hc\\r\\nTo: <sip:siphon.test>\\r\\nCall-ID: hc@check\\r\\nCSeq: 1 OPTIONS\\r\\nMax-Forwards: 1\\r\\nContent-Length: 0\\r\\n\\r\\n', ('127.0.0.1',5060)); s.recv(1024); s.close()\""]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    profiles:
      - voice-ai

  # Carrier UAC: INVITE with SDP, expects an anchored answer, then BYE
  sipp-voice-ai-uac:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-voice-ai:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.105
    entrypoint:
      - sipp
      - "172.20.0.104:5060"
      - -sf
      - /sipp/scenarios/voice_ai_uac.xml
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "30"
      - -timeout_error
      - -trace_err
    profiles:
      - voice-ai

  # ── Cold transfer off a single-leg answered call ──────────────────────────
  # Requires the "refer-single-leg" profile.
  #
  # siphon answers the call itself (no B leg) and then transfers the caller away
  # with an in-dialog REFER. Two UACs share the stack: one accepts the REFER,
  # one challenges it with 407 and asserts the credentialed retry.
  #
  # IP assignments:
  #   172.20.0.106 — mock siphon-rtp control server
  #   172.20.0.107 — siphon (B2BUA)
  #   172.20.0.108 — carrier UAC (plain + challenge)

  mock-siphon-rtp-refer:
    image: python:3.12-slim
    container_name: mock-siphon-rtp-refer
    volumes:
      - ./siphon-rtp:/app:ro
    working_dir: /app
    command: ["python3", "mock_siphon_rtp.py"]
    environment:
      SIPHON_RTP_PORT: "8080"
      MOCK_MEDIA_IP: "203.0.113.1"
      MOCK_MEDIA_PORT: "30000"
    networks:
      sipnet:
        ipv4_address: 172.20.0.106
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,struct,json; s=socket.create_connection(('127.0.0.1',8080),2); b=json.dumps({'id':1,'command':'ping'}).encode(); s.sendall(struct.pack('!I',len(b))+b); h=s.recv(4); n=struct.unpack('!I',h)[0]; d=s.recv(n); s.close(); exit(0 if b'pong' in d else 1)\""]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 3s
    profiles:
      - refer-single-leg

  siphon-refer:
    build:
      context: ..
    container_name: siphon-refer-test
    depends_on:
      mock-siphon-rtp-refer:
        condition: service_healthy
    volumes:
      - ./siphon-rtp/siphon-refer.yaml:/etc/siphon/siphon.yaml:ro
      - ./siphon-rtp/refer_single_leg.py:/etc/siphon/scripts/refer_single_leg.py:ro
      - ../examples:/etc/siphon/examples:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.107
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'OPTIONS sip:siphon.test SIP/2.0\\r\\nVia: SIP/2.0/UDP 127.0.0.1:15060;branch=z9hG4bK-hc\\r\\nFrom: <sip:hc@siphon.test>;tag=hc\\r\\nTo: <sip:siphon.test>\\r\\nCall-ID: hc@check\\r\\nCSeq: 1 OPTIONS\\r\\nMax-Forwards: 1\\r\\nContent-Length: 0\\r\\n\\r\\n', ('127.0.0.1',5060)); s.recv(1024); s.close()\""]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    profiles:
      - refer-single-leg

  # Accepts the REFER (202) and reports the outcome with a sipfrag NOTIFY.
  sipp-refer-single-leg-uac:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-refer:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.108
    entrypoint:
      - sipp
      - "172.20.0.107:5060"
      - -sf
      - /sipp/scenarios/refer_single_leg_uac.xml
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "30"
      - -timeout_error
      - -trace_err
    profiles:
      - refer-single-leg

  # Challenges the REFER with 407 and asserts the credentialed retry.
  sipp-refer-challenge-uac:
    image: ctaloi/sipp:latest
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.108
    entrypoint:
      - sipp
      - "172.20.0.107:5060"
      - -sf
      - /sipp/scenarios/refer_challenge_uac.xml
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "30"
      - -timeout_error
      - -trace_err
    profiles:
      - refer-single-leg

  # ── Re-INVITE renegotiation on the siphon-rtp backend ─────────────────────
  # Requires the "reoffer" profile.
  #
  # The same hold/resume flow the --reinvite mode runs, pointed at the native
  # backend. That mode runs against rtpengine, where a repeat `offer` on a live
  # call-id IS the re-offer — so it cannot tell a renegotiation from a
  # replacement. siphon-rtp draws the line differently: a repeat offer frees the
  # call and re-allocates, taking any WebSocket bridge, tee or SIPREC
  # subscription with it. The mock models both, so a regression shows up twice:
  # in the verb it logs and in the media port the caller is answered with.
  #
  # IP assignments:
  #   172.20.0.109 — mock siphon-rtp control server
  #   172.20.0.110 — siphon (proxy, media.backend: siphon-rtp)
  #   172.20.0.112 — registration helper (bob), then the B-leg UAS
  #   172.20.0.113 — A-leg UAC (INVITE, hold, resume, BYE)

  mock-siphon-rtp-reoffer:
    image: python:3.12-slim
    container_name: mock-siphon-rtp-reoffer
    volumes:
      - ./siphon-rtp:/app:ro
    working_dir: /app
    command: ["python3", "mock_siphon_rtp.py"]
    environment:
      SIPHON_RTP_PORT: "8080"
      MOCK_MEDIA_IP: "203.0.113.1"
      MOCK_MEDIA_PORT: "30000"
    networks:
      sipnet:
        ipv4_address: 172.20.0.109
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,struct,json; s=socket.create_connection(('127.0.0.1',8080),2); b=json.dumps({'id':1,'command':'ping'}).encode(); s.sendall(struct.pack('!I',len(b))+b); h=s.recv(4); n=struct.unpack('!I',h)[0]; d=s.recv(n); s.close(); exit(0 if b'pong' in d else 1)\""]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 3s
    profiles:
      - reoffer

  siphon-reoffer:
    build:
      context: ..
    container_name: siphon-reoffer-test
    depends_on:
      mock-siphon-rtp-reoffer:
        condition: service_healthy
    volumes:
      - ./siphon-rtp/siphon-reoffer.yaml:/etc/siphon/siphon.yaml:ro
      - ../scripts:/etc/siphon/scripts:ro
      - ../examples:/etc/siphon/examples:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.110
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'OPTIONS sip:siphon.test SIP/2.0\\r\\nVia: SIP/2.0/UDP 127.0.0.1:15060;branch=z9hG4bK-hc\\r\\nFrom: <sip:hc@siphon.test>;tag=hc\\r\\nTo: <sip:siphon.test>\\r\\nCall-ID: hc@check\\r\\nCSeq: 1 OPTIONS\\r\\nMax-Forwards: 1\\r\\nContent-Length: 0\\r\\n\\r\\n', ('127.0.0.1',5060)); s.recv(1024); s.close()\""]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    profiles:
      - reoffer

  sipp-reoffer-register:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-reoffer:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        # Same address as the UAS below, and deliberately so: the registrar
        # binds bob to the source address the REGISTER arrived from, so the
        # contact only points at the UAS if they share an IP. They never run at
        # the same time — the UAS waits for this to complete.
        ipv4_address: 172.20.0.112
    entrypoint:
      - sipp
      - "172.20.0.110:5060"
      - -sf
      - /sipp/scenarios/register.xml
      - -s
      - bob
      - -ap
      - secret
      - -m
      - "1"
      - -timeout
      - "20"
      - -trace_err
    profiles:
      - reoffer

  sipp-reoffer-uas:
    image: ctaloi/sipp:latest
    depends_on:
      sipp-reoffer-register:
        condition: service_completed_successfully
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.112
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/reinvite_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - reoffer

  sipp-reoffer-uac:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-reoffer:
        condition: service_healthy
      sipp-reoffer-uas:
        condition: service_started
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.113
    entrypoint:
      - sipp
      - "172.20.0.110:5060"
      - -sf
      - /sipp/scenarios/reinvite_uac.xml
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "30"
      - -timeout_error
      - -trace_err
    profiles:
      - reoffer


  # ── REAL siphon-rtp engine ────────────────────────────────────────────────
  # The published engine image, standing in for the Python control-plane mocks
  # (sipp/siphon-rtp/mock_siphon_rtp.py) the way rtpengine-real stands in for
  # sipp/rtpengine/mock_rtpengine.py. The mocks stay: they echo every command
  # they receive so a scenario can assert on what siphon *sent*, which a real
  # engine cannot do. These profiles assert the complementary half — that a
  # real engine accepts it and moves real audio.
  #
  # One service serves all three profiles because it opens both control planes
  # at once: --control (native JSON-over-TCP) and --ng (rtpengine bencode).
  #
  # The tag is pinned to the same release siphon pins `siphon-rtp-proto` to, so
  # this tests a known-good pairing. Floating :latest would turn an unrelated
  # engine release into a red CI run here.
  #
  # Usage:
  #   docker compose -f sipp/docker-compose.yaml --profile siphon-rtp-native \
  #     up --abort-on-container-exit sipp-rtp-native-uac
  siphon-rtp-engine:
    image: ghcr.io/siphon-project/siphon-rtp:0.2.0
    container_name: siphon-rtp-engine
    command:
      - "--control"
      - "0.0.0.0:8080"
      - "--ng"
      - "0.0.0.0:22222"
      # Load-bearing. The UDP backend binds loopback by default (a NIC-free dev
      # convenience), so without this the engine answers with c=IN IP4 127.0.0.1
      # and no RTP on this network can ever reach it. The scenarios assert on
      # this address precisely so that regression fails loudly.
      - "--relay-bind-ip"
      - "172.20.0.130"
      - "--port-min"
      - "30000"
      - "--port-max"
      - "30200"
      - "--metrics-addr"
      - "0.0.0.0:9091"
    networks:
      sipnet:
        ipv4_address: 172.20.0.130
    # No healthcheck: the image is distroless (no shell, no python), so a
    # CMD-SHELL probe cannot run inside it. Readiness is gated by the
    # siphon-rtp-engine-ready one-shot below, which probes /readyz from outside.
    profiles:
      - siphon-rtp-native
      - siphon-rtp-ng
      - voice-ai-real

  # Readiness gate for the distroless engine: exits 0 once /readyz answers.
  siphon-rtp-engine-ready:
    image: python:3.12-slim
    container_name: siphon-rtp-engine-ready
    depends_on:
      siphon-rtp-engine:
        condition: service_started
    networks:
      sipnet:
        ipv4_address: 172.20.0.140
    command:
      - python3
      - -c
      - |
        import sys, time, urllib.request
        for _ in range(60):
            try:
                with urllib.request.urlopen("http://172.20.0.130:9091/readyz", timeout=2) as r:
                    if r.status == 200:
                        print("engine ready"); sys.exit(0)
            except Exception:
                pass
            time.sleep(1)
        sys.exit("engine never became ready")
    profiles:
      - siphon-rtp-native
      - siphon-rtp-ng
      - voice-ai-real

  # ── Native JSON control plane (media.backend: siphon-rtp) ─────────────────
  siphon-rtp-native:
    build:
      context: ..
    container_name: siphon-rtp-native-test
    depends_on:
      siphon-rtp-engine-ready:
        condition: service_completed_successfully
    volumes:
      - ./siphon-rtp/siphon-rtp-native.yaml:/etc/siphon/siphon.yaml:ro
      - ./siphon-rtp/proxy_rtp_passthrough.py:/etc/siphon/scripts/proxy_rtp_passthrough.py:ro
      - ../examples:/etc/siphon/examples:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.132
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'OPTIONS sip:siphon.test SIP/2.0\\r\\nVia: SIP/2.0/UDP 127.0.0.1:15060;branch=z9hG4bK-hc\\r\\nFrom: <sip:hc@siphon.test>;tag=hc\\r\\nTo: <sip:siphon.test>\\r\\nCall-ID: hc@check\\r\\nCSeq: 1 OPTIONS\\r\\nMax-Forwards: 1\\r\\nContent-Length: 0\\r\\n\\r\\n', ('127.0.0.1',5060)); s.recv(1024); s.close()\""]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    profiles:
      - siphon-rtp-native

  sipp-rtp-native-register:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-rtp-native:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.133
    entrypoint:
      - sipp
      - "172.20.0.132:5060"
      - -sf
      - /sipp/scenarios/register.xml
      - -s
      - bob
      - -ap
      - secret
      - -m
      - "1"
      - -timeout
      - "10"
    profiles:
      - siphon-rtp-native

  sipp-rtp-native-uas:
    image: ctaloi/sipp:latest
    depends_on:
      sipp-rtp-native-register:
        condition: service_completed_successfully
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.133
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/rtpengine_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - siphon-rtp-native

  sipp-rtp-native-uac:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-rtp-native:
        condition: service_healthy
      sipp-rtp-native-uas:
        condition: service_started
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.134
    entrypoint:
      - sipp
      - "172.20.0.132:5060"
      - -sf
      - /sipp/scenarios/rtpengine_uac.xml
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "30"
      - -timeout_error
      - -trace_err
    profiles:
      - siphon-rtp-native

  # ── rtpengine NG shim (drop-in replacement proof) ─────────────────────────
  # Identical to the native stack above except for the media backend, and it
  # runs the same scenarios the rtpengine profile uses, unmodified.
  siphon-rtp-ng:
    build:
      context: ..
    container_name: siphon-rtp-ng-test
    depends_on:
      siphon-rtp-engine-ready:
        condition: service_completed_successfully
    volumes:
      - ./siphon-rtp/siphon-rtp-ng.yaml:/etc/siphon/siphon.yaml:ro
      - ./siphon-rtp/proxy_rtp_passthrough.py:/etc/siphon/scripts/proxy_rtp_passthrough.py:ro
      - ../examples:/etc/siphon/examples:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.135
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'OPTIONS sip:siphon.test SIP/2.0\\r\\nVia: SIP/2.0/UDP 127.0.0.1:15060;branch=z9hG4bK-hc\\r\\nFrom: <sip:hc@siphon.test>;tag=hc\\r\\nTo: <sip:siphon.test>\\r\\nCall-ID: hc@check\\r\\nCSeq: 1 OPTIONS\\r\\nMax-Forwards: 1\\r\\nContent-Length: 0\\r\\n\\r\\n', ('127.0.0.1',5060)); s.recv(1024); s.close()\""]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    profiles:
      - siphon-rtp-ng

  sipp-rtp-ng-register:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-rtp-ng:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.136
    entrypoint:
      - sipp
      - "172.20.0.135:5060"
      - -sf
      - /sipp/scenarios/register.xml
      - -s
      - bob
      - -ap
      - secret
      - -m
      - "1"
      - -timeout
      - "10"
    profiles:
      - siphon-rtp-ng

  sipp-rtp-ng-uas:
    image: ctaloi/sipp:latest
    depends_on:
      sipp-rtp-ng-register:
        condition: service_completed_successfully
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.136
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/rtpengine_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - siphon-rtp-ng

  sipp-rtp-ng-uac:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-rtp-ng:
        condition: service_healthy
      sipp-rtp-ng-uas:
        condition: service_started
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.137
    entrypoint:
      - sipp
      - "172.20.0.135:5060"
      - -sf
      - /sipp/scenarios/rtpengine_uac.xml
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "30"
      - -timeout_error
      - -trace_err
    profiles:
      - siphon-rtp-ng

  # ── Voice-AI over a real WebSocket bridge, with real audio ────────────────
  # The mock control server never dials ws_uri, so until now nothing proved
  # audio crosses the bridge. Here the engine really connects to the AI server,
  # decodes the caller's G.711 to L16, and re-encodes the reply.
  mock-ai-ws:
    image: python:3.12-slim
    container_name: mock-ai-ws
    volumes:
      - ./siphon-rtp:/app:ro
    working_dir: /app
    # websockets is not in the base image; install then serve.
    command: ["sh", "-c", "pip install --quiet --no-cache-dir websockets && exec python3 mock_ai_ws.py"]
    environment:
      AI_WS_PORT: "9001"
      AI_WS_MIN_FRAMES: "10"
    networks:
      sipnet:
        ipv4_address: 172.20.0.131
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('127.0.0.1',9001),2).close()\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    profiles:
      - voice-ai-real

  siphon-voice-ai-real:
    build:
      context: ..
    container_name: siphon-voice-ai-real-test
    depends_on:
      siphon-rtp-engine-ready:
        condition: service_completed_successfully
      mock-ai-ws:
        condition: service_healthy
    volumes:
      - ./siphon-rtp/siphon-voice-ai-real.yaml:/etc/siphon/siphon.yaml:ro
      - ./siphon-rtp/voice_ai_real.py:/etc/siphon/scripts/voice_ai_real.py:ro
      - ../examples:/etc/siphon/examples:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.138
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'OPTIONS sip:siphon.test SIP/2.0\\r\\nVia: SIP/2.0/UDP 127.0.0.1:15060;branch=z9hG4bK-hc\\r\\nFrom: <sip:hc@siphon.test>;tag=hc\\r\\nTo: <sip:siphon.test>\\r\\nCall-ID: hc@check\\r\\nCSeq: 1 OPTIONS\\r\\nMax-Forwards: 1\\r\\nContent-Length: 0\\r\\n\\r\\n', ('127.0.0.1',5060)); s.recv(1024); s.close()\""]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    profiles:
      - voice-ai-real

  # Carrier UAC that actually sends RTP (play_pcap_audio), so the bridge has
  # audio to carry rather than just a socket to open.
  sipp-voice-ai-real-uac:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-voice-ai-real:
        condition: service_healthy
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.139
    entrypoint:
      - sipp
      - "172.20.0.138:5060"
      - -sf
      - /sipp/scenarios/voice_ai_real_uac.xml
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "40"
      - -timeout_error
      - -trace_err
    profiles:
      - voice-ai-real

# ── Network ────────────────────────────────────────────────────────────────
networks:
  sipnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
