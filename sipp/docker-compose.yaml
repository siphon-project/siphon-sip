  # Tests mid-dialog re-INVITE with RTPEngine offer/answer cycle.
  # Flow: INVITE → 200 → ACK → re-INVITE(hold) → 200 → ACK
  #                           → re-INVITE(resume) → 200 → ACK → BYE → 200

  sipp-reinvite-uas:
    image: ctaloi/sipp:latest
    depends_on:
      sipp-rtpengine-register:
        condition: service_completed_successfully
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.42
    entrypoint:
      - sipp
      - -sf
      - /sipp/scenarios/reinvite_uas.xml
      - -p
      - "5060"
      - -m
      - "1"
      - -timeout
      - "30"
      - -trace_err
    profiles:
      - reinvite

  sipp-reinvite-uac:
    image: ctaloi/sipp:latest
    depends_on:
      siphon-rtpengine:
        condition: service_healthy
      sipp-reinvite-uas:
        condition: service_started
    volumes:
      - .:/sipp/scenarios:ro
    networks:
      sipnet:
        ipv4_address: 172.20.0.43
    entrypoint:
      - sipp
      - "172.20.0.41:5060"
      - -sf
      - /sipp/scenarios/reinvite_uac.xml
      - -m
      - "1"
      - -l
      - "1"
      - -timeout
      - "30"
