      - b2bua
      - b2bua-session-timer
      - b2bua-failure
      - b2bua-reinvite
      - b2bua-reinvite-bleg
      - b2bua-reinvite-reject
      - b2bua-reinvite-breject
      - b2bua-update
      - b2bua-bye-glare
      - b2bua-cancel
      - b2bua-early-media
      - b2bua-topology
      - b2bua-refer

  # Register bob with Contact pointing to the basic UAS IP (172.20.0.52)
