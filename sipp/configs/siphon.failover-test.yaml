# siphon.failover-test.yaml — terminating failover across an AoR's bindings.
#
# Used with: sipp/docker-compose.yaml --profile failover (scripts/failover_test.sh)
# Script:    scripts/failover_proxy.py
#
# No auth: the acceptance scenarios are about routing and timing, and the
# fixture registers each UE exactly once.

listen:
  udp:
    - "0.0.0.0:5060"

domain:
  local:
    - "siphon.test"
    - "172.20.0.13"

advertised_address: "172.20.0.13"

script:
  path: "scripts/failover_proxy.py"
  reload: auto

# Scenario 3: Timer F of a relayed non-INVITE (RFC 3261 §17.1.2.2) is 3 s
# instead of 64*T1. Scenarios 1 and 2 relay only INVITEs, which it leaves alone.
transaction:
  timeout_secs: 3

registrar:
  backend: memory
  default_expires: 3600
  max_expires: 7200

log:
  level: debug
  format: pretty
