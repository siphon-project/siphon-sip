[CA_default]
copy_extensions = copy

[req]
default_bits = 4096
prompt = no
default_md = sha256
x509_extensions = v3_ca

[v3_ca]
basicConstraints = CA:FALSE
keyUsage = digitalSignature, keyEncipherment
subjectAltName = @alternate_names
extendedKeyUsage=serverAuth,clientAuth

[alternate_names]
DNS.1 = localhost
DNS.2 = network-element
IP.1 = 127.0.0.1
# Added for this interop profile; the upstream file stops at IP.1.
#
# The names cover X1, where both ends dial each other by name.
DNS.3 = li-simulator
DNS.4 = simulator
DNS.5 = siphon-rtp
# The literals cover X2 and X3. A destination is provisioned over X1 as a
# TS 103 280 `IPAddressPort`, whose `IPv4Address` is a dotted quad by
# definition, so the mediation function is dialled by literal address and its
# certificate is verified against that literal. These match the addresses
# docker-compose.li.yaml pins, which is why it pins them.
IP.2 = 172.29.0.10
IP.3 = 172.29.0.20
IP.4 = 172.29.0.30
# The TLS tap of the capture profile. The media engine has no server-name
# override — it verifies the mediation function against the literal it was
# provisioned with — so the tap has to be able to present a certificate for the
# address it listens on.
IP.5 = 172.29.0.50
