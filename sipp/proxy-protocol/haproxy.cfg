# HAProxy in front of a siphon `tls` listener, speaking the PROXY protocol v2.
#
# This is the deployment the feature exists for: the front terminates the UA's
# connection and opens its own to siphon, so without a PROXY header every
# consumer downstream keys on the front's address instead of the phone's.
#
# `mode tcp` — HAProxy is a byte pipe here, it parses no SIP.
# `send-proxy-v2` — the binary header goes out as the first bytes of the server
#   connection, BEFORE the TLS ClientHello. That ordering is the whole point:
#   siphon reads the header in cleartext ahead of its handshake, which is the
#   only way a re-encrypting front can convey the client's address at all.
# `ssl verify none` — the backend leg is TLS to siphon's `listen.tls`. The
#   certificate is generated per run by the driver script, so there is no CA to
#   pin and nothing here is a trust decision under test.

global
    log stdout format raw local0 info

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend sip_in
    bind :5060
    default_backend siphon_tls

backend siphon_tls
    server siphon1 192.0.2.10:5061 send-proxy-v2 ssl verify none
