# Dependabot — weekly, grouped to keep PR noise low.
#
# NOTE: cargo PRs must NOT be auto-merged. Project policy mandates the 16-row
# perf baseline + mem-leak test before every commit, and CI does not run perf — a
# crate bump that is green in CI can still regress throughput or leak. Treat
# each cargo PR as "green CI AND I ran the perf/mem baseline". Docker bumps are
# safe to merge on green CI.
#
# Supply chain: a compromised release usually gets yanked within days, so cargo
# and github-actions updates wait out a 7-day cooldown before Dependabot offers
# them. Actions are pinned to full commit SHAs (a tag can be moved under us, a SHA
# cannot); an action bump PR changes the SHA, so read the action's diff between
# the two SHAs before merging, not just CI. The release workflows run those
# actions with crates.io / PyPI / registry publish rights.
version: 2
updates:
  # Rust crate dependencies — one grouped PR for all minor/patch bumps;
  # major bumps arrive as individual PRs to review deliberately.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # The two EXCLUDED standalone workspaces. They carry their own Cargo.lock, so
  # the "/" entry above never touches them — which is precisely how siphon-bin/
  # drifted onto a crossbeam-epoch advisory (RUSTSEC-2026-0204) that the root
  # workspace had already been bumped off, and a yanked spin, without anything
  # noticing. Without this block the weekly audit only ever reports that drift
  # after the fact; this is what stops it accumulating.
  #
  # siphon-bin also git-deps siphon-sip at `branch = "main"`, and Dependabot
  # advances that locked SHA — which is what keeps the composition from quietly
  # building an ever-older lib. The EXTENSION crates are pinned to release tags
  # on purpose (deliberate, reviewed bumps — see siphon-bin/Cargo.toml), and
  # Dependabot mis-resolves tag-pinned cargo git deps (dependabot-core#10913),
  # so they are ignored here and bumped by hand.
  - package-ecosystem: cargo
    directories:
      - "/siphon-bin"
      - "/siphon-control-sdk"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # siphon-sip is our own lib; its locked SHA should keep tracking main.
    cooldown:
      default-days: 7
      exclude: ["siphon-sip"]
    groups:
      cargo-excluded-workspaces-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "siphon-smpp"
      - dependency-name: "siphon-http"

  # SHA-pinned actions in the workflows; the `# vX.Y.Z` comment is what
  # Dependabot reads to propose the next version.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # Dockerfile base image (debian:trixie-slim).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
