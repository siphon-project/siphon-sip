# .github/workflows/ci.yaml — SIPhon CI pipeline
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:   # manual "Run workflow" — also the only trigger for sipp-ipsec

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Rust unit + integration tests ────────────────────────────────────────
  # Run twice: the default build (no SCTP — proves the crate compiles and the
  # suite passes WITHOUT the libsctp system dependency) and the `sctp` feature
  # (exercises the gated SIP/Diameter-over-SCTP transport code).
  rust-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: default
            flags: ""
            sctp: false
          - name: sctp
            flags: "--features sctp"
            sctp: true
    name: rust-tests (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.14 (free-threaded)
        uses: deadsnakes/action@v3.2.0
        with:
          python-version: "3.14-dev"

      - name: Install SCTP system dependency
        if: ${{ matrix.sctp }}
        run: sudo apt-get update && sudo apt-get install -y libsctp-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: PYO3_PYTHON=python3.14 cargo test ${{ matrix.flags }}

      # Runs alone because it measures a process-global counter: glibc in-use
      # bytes. Inside the parallel binary the other tests allocate on the same
      # order as the signal, so it is `#[ignore]`d there and gated here, where
      # nothing else is running and the numbers are exact. Skipping it would
      # let the reaped-thread PyThreadState leak back in — it orphans CPython
      # thread states on the glibc heap, invisible to jemalloc and to
      # `siphon_memory_*`.
      - name: Python thread-state leak guard (needs the process to itself)
        run: |
          PYO3_PYTHON=python3.14 cargo test --lib ${{ matrix.flags }} -- --ignored --exact \
            server::tests::reaped_thread_releases_its_python_thread_state \
            --test-threads=1 --nocapture

  # ── Formatting gate ─────────────────────────────────────────────────────
  # `cargo fmt --all -- --check` on rustfmt defaults — no `rustfmt.toml`, which
  # is what siphon-rtp does, so the two repos format identically. Needs no
  # Python or libsctp: rustfmt parses the source, it does not build it, so this
  # is the cheapest gate in the pipeline and fails in seconds.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── File-size gate ──────────────────────────────────────────────────────
  # Production lines only (inline `#[cfg(test)]` stripped), so the gate cannot
  # push tests out of a file to satisfy a number. Needs no toolchain at all —
  # it reads the source, so it fails in seconds next to rustfmt.
  file-size:
    name: file size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check_file_size.py
      - run: scripts/check_too_many_lines_allows.py

  # ── Missing-`await` gate ────────────────────────────────────────────────
  # A forgotten `await` on an awaitable script API does not raise: the call
  # returns a truthy coroutine that never runs, so the handler reads as
  # working. Nothing but a live node executes these scripts, so this is the
  # only place that catches it. Toolchain-free, same as the size gate.
  script-await:
    name: script await
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Prove the matcher still discriminates before trusting its verdict — a
      # gate that silently stops matching is how a check like this fails.
      - run: scripts/check_awaited_apis.py --self-test
      - run: scripts/check_awaited_apis.py

  # ── Clippy lint gate ────────────────────────────────────────────────────
  # Mirrors the rust-tests build env (free-threaded Python 3.14 + libsctp-dev
  # are needed for the crate to compile at all). `-D warnings` turns any
  # clippy lint or rustc warning into a hard failure so the clippy-clean
  # baseline cannot regress.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.14 (free-threaded)
        uses: deadsnakes/action@v3.2.0
        with:
          python-version: "3.14-dev"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsctp-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Lint three feature configs. The default build (SCTP off) and
      # `--all-features` (SCTP on, compiling the gated libsctp code) catch the
      # code that is in or out with those. `--no-default-features` is the one
      # nothing covered: it turns off `redis-backend` and `postgres-backend`,
      # which is where the stub halves of the registrar, cache, iFC and auth
      # backends live. That configuration had stopped compiling entirely — a
      # call into a `#[cfg(feature = "redis-backend")]` function from an arm
      # that was not gated — and no job built it, so nothing said so.
      - name: Run clippy (default features)
        run: PYO3_PYTHON=python3.14 cargo clippy --all-targets -- -D warnings

      - name: Run clippy (all features)
        run: PYO3_PYTHON=python3.14 cargo clippy --all-targets --all-features -- -D warnings

      - name: Run clippy (no default features)
        run: PYO3_PYTHON=python3.14 cargo clippy --no-default-features --all-targets -- -D warnings

  # ── Criterion bench compile gate ─────────────────────────────────────────
  # Keep the per-message hot-path criterion benches (benches/sip_hot_path.rs)
  # compiling so they never bit-rot. The hard ">10% regression fails" gate is
  # deliberately NOT run here: absolute timings on shared GitHub runners are too
  # noisy to gate on. That gate runs at release-cut on the same fixed hardware
  # as the README throughput table (scripts/bench_regression.sh, wired into
  # scripts/cut-release.sh). Mirrors rust-tests' build env (the crate links
  # PyO3, so the benches need free-threaded Python 3.14 + libsctp-dev to build).
  benches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.14 (free-threaded)
        uses: deadsnakes/action@v3.2.0
        with:
          python-version: "3.14-dev"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsctp-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compile benches (no run)
        run: PYO3_PYTHON=python3.14 cargo bench --no-run --all-features

  # ── Dependency policy gate (cargo-deny) ─────────────────────────────────
  # The DETERMINISTIC half of cargo-deny: bans (duplicate / wildcard crates),
  # licenses, and sources. These only move when the dependency set moves, so
  # they belong on every PR — a GPL dependency, a new git source, or a
  # duplicate-crate blowup fails right where it was introduced.
  #
  # The time-varying half — `check advisories` — deliberately does NOT run
  # here: a fresh RustSec advisory can land against a dependency that has not
  # changed and would turn a green PR red on untouched code. That runs weekly
  # and on main instead (.github/workflows/audit.yml).
  #
  # One matrix entry per workspace: siphon-bin/ and siphon-control-sdk/ are
  # excluded standalone workspaces with their own Cargo.lock + deny.toml, so a
  # `cargo deny` at the repo root resolves only the siphon-sip graph.
  deny:
    name: cargo-deny (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: siphon-sip
            manifest: ./Cargo.toml
          - name: siphon-bin
            manifest: ./siphon-bin/Cargo.toml
          - name: control-sdk
            manifest: ./siphon-control-sdk/Cargo.toml
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}
          command: check bans licenses sources

  # ── siphon-bin extension binary (opt-in extensions) ─────────────────────
  # The siphon-bin/ package is a SEPARATE, excluded standalone workspace that
  # git-deps the published siphon-sip lib + the extension crates, so the main
  # jobs above never build it. This job is the bit-rot guard for the
  # composition: it proves the `siphon` binary still compiles (and is
  # clippy-clean) with no extensions, with each extension on its own, and with
  # every extension at once. It builds the lib the way an operator would — from
  # the git deps, NOT from the in-tree source of this checkout (the deliberate
  # git-dep tradeoff), so an in-tree change reaches this job only once it is on
  # main and siphon-bin/Cargo.lock has advanced onto it.
  #
  # That lock is the reason this is a bit-rot guard and not a freshness check:
  # `cargo build` resolves the exact SHA committed there, so this job is green
  # against a siphon-sip main it may be many commits behind. Dependabot advances
  # the lock weekly (.github/dependabot.yml) — that, not this job, is what keeps
  # the composition current.
  #
  # Adding an extension module: give it its own build + clippy pair below. The
  # combined leg rides on the `full` aggregate feature, so it picks the new
  # module up from Cargo.toml without a workflow edit.
  siphon-bin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siphon-bin
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.14 (free-threaded)
        uses: deadsnakes/action@v3.2.0
        with:
          python-version: "3.14-dev"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: siphon-bin

      # siphon-sigtran reaches kernel SCTP through async-sctp, which links
      # libsctp — needed to LINK the `sigtran` and `full` legs below, not just
      # to run them.
      - name: Install libsctp
        run: sudo apt-get update && sudo apt-get install -y libsctp-dev

      # Nothing at all: the plain composition, with every `extensions.<name>`
      # block parsing and being skipped with a loud warning. `http` is a default
      # feature now, so this leg needs --no-default-features to still cover the
      # truly-empty build.
      - name: Build (no extensions)
        run: PYO3_PYTHON=python3.14 cargo build --no-default-features

      - name: Clippy (no extensions)
        run: PYO3_PYTHON=python3.14 cargo clippy -p siphon-bin --no-default-features -- -D warnings

      # The default build — `http` and nothing else. This is what a bare
      # `cargo build -p siphon-bin` gets you, so it is worth its own leg.
      - name: Build (defaults)
        run: PYO3_PYTHON=python3.14 cargo build

      - name: Clippy (defaults)
        run: PYO3_PYTHON=python3.14 cargo clippy -p siphon-bin -- -D warnings

      # Feature on: pulls siphon-smpp + smpp34 and wires the `smpp` namespace.
      - name: Build (--features smpp)
        run: PYO3_PYTHON=python3.14 cargo build --features smpp

      - name: Clippy (--features smpp)
        run: PYO3_PYTHON=python3.14 cargo clippy -p siphon-bin --features smpp -- -D warnings

      # siphon-http on its own, without the default pulling it in — proves the
      # feature still stands alone if the default ever changes back.
      - name: Build (--features http, no defaults)
        run: PYO3_PYTHON=python3.14 cargo build --no-default-features --features http

      - name: Clippy (--features http, no defaults)
        run: PYO3_PYTHON=python3.14 cargo clippy -p siphon-bin --no-default-features --features http -- -D warnings

      # Same for siphon-sigtran: SIGTRAN/SS7 transport, routing and MAP/CAP/INAP
      # termination. This is the one module that mounts its surface through
      # `register_module_extension` rather than a single namespace.
      - name: Build (--features sigtran)
        run: PYO3_PYTHON=python3.14 cargo build --features sigtran

      - name: Clippy (--features sigtran)
        run: PYO3_PYTHON=python3.14 cargo clippy -p siphon-bin --features sigtran -- -D warnings

      # Every module at once — the real drop-in binary, and the only leg that
      # catches cross-extension breakage: a version skew between two extension
      # crates' siphon-sip pins, or two modules claiming the same namespace.
      # `full` is the aggregate in Cargo.toml, so a new module joins this leg
      # by being added there.
      - name: Build (--features full)
        run: PYO3_PYTHON=python3.14 cargo build --features full

      - name: Clippy (--features full)
        run: PYO3_PYTHON=python3.14 cargo clippy -p siphon-bin --features full -- -D warnings

      # The release composition, and the one leg that is NOT a bit-rot guard.
      # Everything above resolves siphon-sip from git, so it can be green against
      # a lib many commits behind this branch. This leg patches siphon-sip to the
      # in-tree source — exactly what release.yaml and the root Dockerfile do —
      # and so answers the question the others cannot: does THIS branch still
      # compile the binary the project actually ships?
      #
      # It matters because the release build now needs siphon-http to compile
      # against the release tree. siphon-http touches a two-type surface
      # (siphon::script::{ScriptHandle, HandlerHandle}); break it here and
      # without this leg the first failure would land halfway through a release
      # cut. `--features ui` mirrors the artifacts; `http` is already default.
      #
      # Kept last on purpose: the pin writes a .cargo config into siphon-bin and
      # must not leak into the unpatched legs above.
      # Invoked by relative path rather than with a working-directory override:
      # this job defaults every step into siphon-bin/, and the script locates the
      # repo root from its own path, so it works from wherever it is called.
      - name: Pin siphon-sip to this checkout
        run: ../scripts/pin-siphon-sip-to-tree.sh

      - name: Build (patched to this tree — the released composition)
        run: PYO3_PYTHON=python3.14 cargo build --features ui

      - name: Clippy (patched to this tree — the released composition)
        run: PYO3_PYTHON=python3.14 cargo clippy -p siphon-bin --features ui -- -D warnings

  # ── External control-plane SDKs (siphon-control-sdk/) ──────────────────
  # `siphon-control-sdk/` is a SEPARATE, excluded standalone workspace with its
  # own Cargo.lock (the same arrangement as `siphon-bin/`), so every job above
  # resolves the siphon-sip graph alone and none of them compiles a line of it.
  # Before this job it appeared in CI exactly once — as a cargo-deny matrix
  # entry, which reads its lockfile and never builds the code. A break in the
  # three crates therefore surfaced for the first time in
  # release-control-sdk.yaml: at tag time, on the one workflow that publishes to
  # PyPI and crates.io, with the tag already cut.
  #
  # Unlike siphon-bin this is NOT a bit-rot guard. Those crates git-dep a
  # published siphon-sip, so that job can be green against a lib many commits
  # behind; these three path-dep each other inside this workspace, so the job
  # compiles THIS checkout and a break fails on the PR that introduced it.
  #
  # The Python leg is why an interpreter is installed at all.
  # `siphon-control` is a PyO3 extension, and `tests/test_smoke.py` drives the
  # REAL module against an in-process `websockets` stub that speaks the
  # `siphon-control.v1` handshake — so it needs the extension built and
  # installed, not merely compiled. It is the only coverage the pyo3 surface
  # has: the `sdk-tests` job below is scoped to `sdk/` (the `siphon` script-API
  # mock) and never sees this package.
  #
  # One interpreter is deliberate. This job answers "does the extension build,
  # and does its surface still behave"; release-control-sdk.yaml owns the
  # per-interpreter matrix (cp314 + cp314t across manylinux, macOS and Windows)
  # that answers "does it build for everyone we ship to". Duplicating that here
  # would cost minutes on every PR to re-prove what only the release needs.
  control-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siphon-control-sdk
    steps:
      - uses: actions/checkout@v7

      # Before the Rust steps: the `siphon-control` crate links against this
      # interpreter, so `cargo test` over the workspace needs it present.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: siphon-control-sdk

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The wire-format tests on siphon-control-proto and the client's
      # integration suite. `--all-targets` above type-checks them; this runs
      # them.
      - name: Tests (proto + client)
        run: cargo test

      # `pip install -e .` and not `maturin develop`: the pyproject already
      # declares the maturin backend, so pip builds the extension through it,
      # and it needs no virtualenv of its own — the same shape the `sdk-tests`
      # job uses for the script-API mock.
      - name: Build and install the extension
        working-directory: siphon-control-sdk/siphon-control
        run: pip install -e . pytest websockets

      - name: Python smoke tests
        working-directory: siphon-control-sdk/siphon-control
        run: pytest -v

  # ── Python SDK tests ──────────────────────────────────────────────────
  sdk-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the SDK version from git tags, so the SDK
          # build needs full history — a shallow clone hides the tags.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install SDK and test dependencies
        run: pip install -e . pytest

      - name: Run SDK tests
        run: pytest -v

      - name: Check scale result parsing
        run: python3 ../scripts/scale_stats_test.py

  # ── SBOM generation ────────────────────────────────────────────────────
  sbom:
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-sbom
        run: cargo install cargo-sbom

      - name: Generate SPDX SBOM
        run: cargo sbom --output-format spdx_json_2_3 > sbom.spdx.json

      - name: Generate CycloneDX SBOM
        run: cargo sbom --output-format cyclone_dx_json_1_4 > sbom.cdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cdx.json

  # ── The one siphon image every SIPp job runs against ───────────────────────
  # Every service in sipp/docker-compose.yaml that runs siphon builds `context: ..`
  # against the root Dockerfile with no build-args and no target override, so they
  # are all the same image. They share the `sipp-siphon` tag; this job produces it
  # once and hands it to the SIPp jobs as an artifact, which they `docker load`.
  # `docker compose up` only builds when the tag is absent, so a loaded image makes
  # every one of them skip the build.
  #
  # Built here rather than per job because a cold `docker compose build` is ~10
  # minutes (apt, uv, CPython 3.14t, rustup, cargo-chef, then the whole release
  # dependency graph) against 10-40 s of actual SIPp testing — it used to be ~96 %
  # of the SIPp fleet's runner time, repeated 20 times per run.
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the siphon test image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: sipp-siphon:latest
          # Same scope as release.yaml's amd64 leg: identical context, Dockerfile
          # and build-args, so the two share one cache entry rather than competing
          # for the repo's cache budget, and each warms the other.
          cache-from: type=gha,scope=linux/amd64
          # Only trunk pushes write it. A cache written from a PR branch is scoped
          # to that branch — invisible to every other PR and to main — so writing
          # from a PR would evict entries that Swatinem/rust-cache also needs
          # without ever being read back.
          #
          # mode=max is load-bearing: everything expensive lives in the chef/planner/
          # builder stages, and mode=min exports only the final stage (debian plus
          # the copied binary), which would cache nothing that costs anything.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=linux/amd64' || '' }}
          outputs: type=docker,dest=/tmp/sipp-siphon.tar

      # ~100 MB compressed vs ~300 MB raw, and `docker load` reads gzip directly.
      # gzip -1 plus compression-level 0 beats letting upload-artifact deflate the
      # whole uncompressed tar.
      - name: Compress
        run: gzip -1 /tmp/sipp-siphon.tar

      - name: Upload the siphon image
        uses: actions/upload-artifact@v7
        with:
          name: sipp-siphon-image
          path: /tmp/sipp-siphon.tar.gz
          retention-days: 1
          compression-level: 0

  # ── SIPp functional tests (basic) ───────────────────────────────────────
  sipp-functional:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start siphon
        run: docker compose -f sipp/docker-compose.yaml up -d --wait siphon

      - name: SIPp OPTIONS test
        run: docker compose -f sipp/docker-compose.yaml run --rm sipp-options

      - name: SIPp REGISTER test
        run: docker compose -f sipp/docker-compose.yaml run --rm sipp-register

      - name: Proxy REFER passthrough (in-dialog REFER loose-routed once, no loop)
        run: docker compose -f sipp/docker-compose.yaml --profile proxy-refer up --abort-on-container-exit --exit-code-from sipp-proxy-refer-uac sipp-proxy-refer-uac sipp-proxy-refer-uas

      - name: Cleanup proxy-refer containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile proxy-refer rm -sf sipp-proxy-refer-uac sipp-proxy-refer-uas sipp-proxy-refer-register 2>/dev/null || true

      - name: Collect siphon logs
        if: always()
        run: docker compose -f sipp/docker-compose.yaml logs siphon > siphon.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-functional-logs
          path: |
            siphon.log
            *.log

  # ── RFC 3261 §18.1.1 over-MTU UDP->TCP fallback (IPv4) ─────────────────────
  # Deterministic signal: an over-MTU MESSAGE is relayed at a TCP-only receiver
  # (200 only if siphon switched to TCP); a small MESSAGE at a UDP-only receiver
  # (200 only if it stayed UDP).  Needs no special capability.  The runner builds
  # the image, runs both cases, dumps siphon+receiver logs on failure, and tears
  # the stack down on exit.
  sipp-mtu:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: MTU §18.1.1 fallback tests (IPv4)
        run: scripts/mtu_test.sh v4

  # ── PROXY protocol: the client address behind a real front ─────────────────
  # A REGISTER + INVITE flow through an actual HAProxy in `send-proxy-v2` mode
  # into siphon's TLS listener.  Deterministic signal: siphon copies what each
  # consumer holds (request.source_ip, source_ip_in(), the stored registration's
  # captured flow, the contact fix_nated_register() rewrote) into headers on the
  # 200, and the caller compares each against its OWN address.  A build that
  # never threads the substitution through answers with HAProxy's address and
  # the caller fails.  Needs no special capability.
  sipp-proxy-protocol:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Client address survives a PROXY-protocol front (HAProxy → TLS)
        run: scripts/proxy_protocol_test.sh

  # ── failed_auth_ban auto-ban, including behind a PROXY-protocol front ──────
  # Three existing phases (failed auth, non-SIP probe, rejected WS upgrade) plus
  # one that asserts WHICH address a ban lands on when the traffic arrives
  # behind a front: the abuser the header names, never the front itself.
  # Banning the front turns one abuser into an outage for every client behind
  # the load balancer, and nothing in the wire behaviour makes that visible —
  # the harness reads GET /admin/bans instead.
  sipp-banscan:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Auto-ban records the abuser, not the front
        run: scripts/banscan_test.sh

  # ── RFC 3261 §16.4 Route self-identity ─────────────────────────────────────
  # A proxy must consume the Record-Route it inserted itself, or every in-dialog
  # request of a healthy dialog is refused.  The standard functional stack
  # cannot show this: siphon.test.yaml lists the container IP and 127.0.0.1
  # under `domain.local`, which makes a Record-Route recognisable even when
  # Route recognition is keyed on served domains alone.  This job runs a config
  # listing ONLY the served domain — what an operator actually writes for a
  # proxy addressed by IP.  Deterministic and needs no capability: the UAC waits
  # for a 200 to its in-dialog BYE, which only arrives if the self-Route was
  # consumed and the request relayed.
  sipp-route-selfid:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Route self-identity (in-dialog BYE must be relayed, not 404'd)
        run: scripts/route_selfid_test.sh

  # ── Removing an outbound registration must clear it upstream ───────────────
  # RFC 3261 §10.2.2.  Dropping siphon's own state leaves the binding on the
  # registrar until the granted Expires runs out, so a trunk that was deleted
  # keeps being offered calls.  siphon registers one trunk with a SIPp
  # registrar, the script removes it once it is up, and the scenario fails
  # unless the `Expires: 0` REGISTER arrives on the same Call-ID.
  sipp-registrant:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Removing a trunk must de-register it upstream
        run: scripts/registrant_test.sh


  # ── A forwarding transport error must become a response ────────────────────
  # RFC 3261 §16.9 makes a transport error on forwarding a 503 on that branch,
  # and §16.7 step 6 forwards it upstream as a 500.  Without it the branch goes
  # silent and the caller waits out its own Timer F (32 s) for an answer the
  # proxy already had.  Deterministic: the next hop is a container that is up
  # and listening on nothing, so the connect is refused immediately, and the
  # caller demands the 500 within 20 s.
  sipp-transport-error:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Transport error on forwarding must be answered, not dropped
        run: scripts/transport_error_test.sh

  # ── Terminating failover across an AoR's bindings ──────────────────────────
  # An AoR with two live bindings where only one is reachable must still be
  # deliverable.  Two things have to hold, and neither is visible in the
  # standard functional stack (one binding, no Path, no failure path):
  #   1. Each fork branch is routed by its OWN binding's RFC 3327 Path, so the
  #      failover branch reaches a different edge than the branch before it.
  #   2. @proxy.on_failure fires for a single-destination relay and its
  #      request.relay() actually re-sends.
  # Deterministic: both callers demand a 200, and the run additionally asserts
  # which downstream actually received each INVITE.
  sipp-failover:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Terminating failover (per-binding Path + on_failure retarget)
        run: scripts/failover_test.sh

  # ── B2BUA: routing a binding through its RFC 3327 Path ─────────────────────
  # The B2BUA half of the job above, and a separate code path: it builds a FRESH
  # B-leg INVITE rather than forwarding the caller's, so it used to send it to
  # the callee's Contact — the one address the Path exists to route around, which
  # left a callee registered through an edge proxy unreachable even with a single
  # binding.  Four scenarios: parallel fork, sequential fork (per-branch route
  # sets), call.dial(route=…), and an over-MTU B-leg whose §18.1.1 UDP→TCP
  # re-probe must follow the route set rather than resolving the Contact host.
  # Deterministic: every caller demands a 200, and each scenario asserts which
  # downstream actually received the INVITE — including that the MTU decoy did
  # NOT.
  sipp-b2bua-path:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: B2BUA B-leg follows the binding's Path (fork, dial, over-MTU)
        run: scripts/b2bua_path_test.sh

  # IPv6 leg — manual dispatch only.  A user-defined compose network with
  # enable_ipv6 + a private ULA subnet keeps all traffic inside the bridge (no
  # host IPv6 egress needed), but docker's IPv6 bridge is not reliable on
  # GitHub-hosted runners, so this is opt-in (also runnable locally with
  # `scripts/mtu_test.sh v6`) rather than a required check.
  sipp-mtu-ipv6:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Enable docker IPv6 (merge into the runner's daemon.json)
        run: |
          sudo apt-get install -y jq
          tmp=$(mktemp)
          jq '. + {experimental: true, ip6tables: true}' \
            /etc/docker/daemon.json 2>/dev/null > "$tmp" || \
            echo '{"experimental": true, "ip6tables": true}' > "$tmp"
          sudo mv "$tmp" /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: MTU §18.1.1 fallback tests (IPv6)
        run: scripts/mtu_test.sh v6

  # ── B2BUA functional tests ─────────────────────────────────────────────
  sipp-b2bua:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start siphon-b2bua
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua up -d --wait siphon-b2bua

      - name: Register bob
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua run --rm sipp-b2bua-register

      # Every case runs through sipp/run_call.sh, which waits for the callee to
      # finish rather than stopping it when the caller exits, and grades both.
      # Stopped early, a callee never answers the BYE siphon forwards after
      # answering the caller's, and that BYE's retransmissions then reach the next
      # case's callee on bob's same registered address and abort it.
      - name: B2BUA basic call (INVITE → 200 → BYE)
        run: COMPOSE_PROFILES=b2bua bash sipp/run_call.sh sipp-b2bua-uac sipp-b2bua-uas

      - name: Cleanup basic call containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua down sipp-b2bua-uac sipp-b2bua-uas 2>/dev/null || true

      - name: B2BUA session timer (Session-Expires negotiation)
        run: COMPOSE_PROFILES=b2bua,b2bua-session-timer bash sipp/run_call.sh sipp-b2bua-st-uac sipp-b2bua-st-uas

      - name: Cleanup session timer containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-session-timer down sipp-b2bua-st-uac sipp-b2bua-st-uas 2>/dev/null || true

      - name: B2BUA CANCEL (INVITE → CANCEL → 487)
        run: COMPOSE_PROFILES=b2bua,b2bua-cancel bash sipp/run_call.sh sipp-b2bua-cancel-uac sipp-b2bua-cancel-uas

      - name: Cleanup cancel containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-cancel down sipp-b2bua-cancel-uac sipp-b2bua-cancel-uas 2>/dev/null || true

      # RFC 3261 §14 re-INVITE variants. All four scenarios existed but were
      # wired to nothing — neither CI nor scripts/run-tests.sh named their
      # profiles, so the behaviour they describe was asserted by nobody. Caller
      # and callee are both graded, so the side carrying the assertion counts.
      - name: B2BUA re-INVITE from the A-leg (hold/resume, §8.2.6.2 dialog echo)
        run: COMPOSE_PROFILES=b2bua,b2bua-reinvite bash sipp/run_call.sh sipp-b2bua-reinvite-uac sipp-b2bua-reinvite-uas

      - name: Cleanup reinvite containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-reinvite rm -sf sipp-b2bua-reinvite-uac sipp-b2bua-reinvite-uas 2>/dev/null || true

      # RFC 6086 in-dialog INFO relayed across a two-leg call with its body
      # intact. `--exit-code-from` names the UAS: it carries the body
      # assertion and answers last, and a UAC that got the old 405 aborts the
      # run, which fails the UAS too.
      - name: B2BUA in-dialog INFO relayed to the far leg (RFC 6086)
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua --profile b2bua-info up --abort-on-container-exit --exit-code-from sipp-b2bua-info-uas sipp-b2bua-info-uac sipp-b2bua-info-uas

      - name: Cleanup info containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-info rm -sf sipp-b2bua-info-uac sipp-b2bua-info-uas 2>/dev/null || true

      - name: B2BUA re-INVITE from the B-leg (Via branch correctness)
        run: COMPOSE_PROFILES=b2bua,b2bua-reinvite-bleg bash sipp/run_call.sh sipp-b2bua-reinvite-bleg-uac sipp-b2bua-reinvite-bleg-uas

      - name: Cleanup reinvite-bleg containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-reinvite-bleg rm -sf sipp-b2bua-reinvite-bleg-uac sipp-b2bua-reinvite-bleg-uas 2>/dev/null || true

      - name: B2BUA re-INVITE rejected by the A-leg (dialog survives, §14.1)
        run: COMPOSE_PROFILES=b2bua,b2bua-reinvite-reject bash sipp/run_call.sh sipp-b2bua-reinvite-reject-uac sipp-b2bua-reinvite-reject-uas

      - name: Cleanup reinvite-reject containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-reinvite-reject rm -sf sipp-b2bua-reinvite-reject-uac sipp-b2bua-reinvite-reject-uas 2>/dev/null || true

      # The UAS carries the assertion here: it is the side that must still see a
      # BYE after its own re-INVITE was rejected, so reading the UAC's exit code
      # alone would pass vacuously.
      - name: B2BUA re-INVITE rejected by the B-leg (dialog survives, §14.1)
        run: COMPOSE_PROFILES=b2bua,b2bua-reinvite-breject bash sipp/run_call.sh sipp-b2bua-reinvite-breject-uac sipp-b2bua-reinvite-breject-uas

      - name: Cleanup reinvite-breject containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-reinvite-breject rm -sf sipp-b2bua-reinvite-breject-uac sipp-b2bua-reinvite-breject-uas 2>/dev/null || true

      # RFC 3261 §17.1.1.3 — the CANCELled B-leg's 487 MUST be ACKed, or the
      # callee retransmits it on Timer G to Timer H (64*T1 = 32 s, §17.2.1) on
      # every abandoned outbound attempt.  The UAS carries the assertion: the
      # A-leg gets a correct 487 either way, so reading the UAC's exit code
      # alone would pass vacuously.
      - name: B2BUA CANCEL 487 is ACKed (RFC 3261 §17.1.1.3)
        run: COMPOSE_PROFILES=b2bua,b2bua-cancel-ack bash sipp/run_call.sh sipp-b2bua-cancel-ack-uac sipp-b2bua-cancel-ack-uas

      - name: Cleanup cancel-ack containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-cancel-ack down sipp-b2bua-cancel-ack-uac sipp-b2bua-cancel-ack-uas 2>/dev/null || true

      # RFC 3261 §13.2.2.4: the callee's 200 is ACKed when it arrives, not when
      # the caller ACKs. The caller holds its ACK for 4 s and the callee needs
      # siphon's within 2 s, with its own Contact (an opaque userpart and
      # mixed-case parameters) as the Request-URI. The callee carries the
      # assertion. bob is re-registered at the callee's address first.
      - name: B2BUA callee 2xx ACKed without waiting for the caller (RFC 3261 §13.2.2.4)
        run: COMPOSE_PROFILES=b2bua,b2bua-unacked-2xx bash sipp/run_call.sh sipp-b2bua-unacked-uac sipp-b2bua-unacked-uas

      - name: Cleanup unacked-2xx containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-unacked-2xx rm -sf sipp-b2bua-unacked-uac sipp-b2bua-unacked-uas sipp-b2bua-unacked-register sipp-b2bua-unacked-deregister 2>/dev/null || true

      # RFC 3261 §13.2.2.4 / RFC 3264 §4, delayed offer: the caller's INVITE has
      # no SDP, so the callee offers in its 200 and the ACK siphon sends it has
      # to carry the caller's answer. The callee carries the assertion.
      - name: B2BUA delayed offer, the callee's ACK carries the caller's answer (RFC 3264 §4)
        run: COMPOSE_PROFILES=b2bua,b2bua-delayed-offer bash sipp/run_call.sh sipp-b2bua-delayed-offer-uac sipp-b2bua-delayed-offer-uas

      - name: Cleanup delayed-offer containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-delayed-offer rm -sf sipp-b2bua-delayed-offer-uac sipp-b2bua-delayed-offer-uas sipp-b2bua-delayed-offer-register sipp-b2bua-delayed-offer-deregister 2>/dev/null || true

      # RFC 3261 §13.3.1.4: a caller that never ACKs the 200 has its session
      # ended after 64*T1, with a BYE to both legs. T1 is fixed at 500 ms, so
      # this case takes about 33 s. Both sides carry the assertion.
      - name: B2BUA caller that never ACKs is sent a BYE after 64*T1 (RFC 3261 §13.3.1.4)
        run: COMPOSE_PROFILES=b2bua,b2bua-noack-2xx bash sipp/run_call.sh sipp-b2bua-noack-uac sipp-b2bua-noack-uas

      - name: Cleanup noack-2xx containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-noack-2xx rm -sf sipp-b2bua-noack-uac sipp-b2bua-noack-uas sipp-b2bua-noack-register sipp-b2bua-noack-deregister 2>/dev/null || true

      # RFC 3261 §15: the callee hangs up right after it is ACKed, while the
      # caller still holds its own ACK for 3 s. The callee's BYE has to be
      # answered within 1.5 s; the caller must get no BYE before its ACK and one
      # after it. Both sides carry the assertion.
      - name: B2BUA caller BYE held until the caller ACKs (RFC 3261 §15)
        run: COMPOSE_PROFILES=b2bua,b2bua-bye-before-ack bash sipp/run_call.sh sipp-b2bua-bye-before-ack-uac sipp-b2bua-bye-before-ack-uas

      - name: Cleanup bye-before-ack containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-bye-before-ack rm -sf sipp-b2bua-bye-before-ack-uac sipp-b2bua-bye-before-ack-uas sipp-b2bua-bye-before-ack-register sipp-b2bua-bye-before-ack-deregister 2>/dev/null || true

      - name: Deregister bob (clear previous contacts)
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua --profile b2bua-failure run --rm sipp-b2bua-deregister-bob

      - name: Register bob (failure UAS)
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua --profile b2bua-failure run --rm sipp-b2bua-register-failure

      - name: B2BUA failure (INVITE → 486 Busy)
        run: COMPOSE_PROFILES=b2bua,b2bua-failure bash sipp/run_call.sh sipp-b2bua-failure-uac sipp-b2bua-failure-uas

      - name: Collect siphon-b2bua logs
        if: always()
        run: docker compose -f sipp/docker-compose.yaml logs siphon-b2bua > siphon-b2bua.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua --profile b2bua-session-timer --profile b2bua-cancel --profile b2bua-cancel-ack --profile b2bua-unacked-2xx --profile b2bua-delayed-offer --profile b2bua-noack-2xx --profile b2bua-bye-before-ack --profile b2bua-failure down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-b2bua-logs
          path: |
            siphon-b2bua.log
            *.log

  # ── B2BUA reliable-provisional (RFC 3262) interworking ──────────────────
  # The B-leg answers with a reliable 183 (Require: 100rel, RSeq); the A-leg
  # never advertised 100rel. siphon must auto-PRACK the B-leg and strip the
  # 100rel contract from the 183 forwarded to the A-leg, or a real trunk CANCELs.
  #
  # Runs against a dedicated instance pinned to `sip-trunk-edge@2026`, whose
  # response default is Copy — it does not strip Require/RSeq — so the strip is
  # proven to be framework-auto rather than a side effect of the default preset.
  #
  # Its own job because it needs its own siphon instance and its own
  # registration, and because it was previously driven only by
  # scripts/run-tests.sh: a regression in the 100rel interworking was not caught
  # on the PR that caused it. That is the gap this closes.
  sipp-b2bua-reliable-prov:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start siphon-b2bua-trunk-edge
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-reliable-prov up -d --wait siphon-b2bua-trunk-edge

      - name: Register bob against the trunk-edge instance
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-reliable-prov run --rm sipp-b2bua-trunk-edge-register

      - name: Reliable 183 auto-PRACKed, 100rel stripped toward the A-leg
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-reliable-prov up --abort-on-container-exit --exit-code-from sipp-b2bua-reliable-prov-uac sipp-b2bua-reliable-prov-uac sipp-b2bua-reliable-prov-uas

      - name: Collect siphon logs
        if: always()
        run: docker compose -f sipp/docker-compose.yaml logs siphon-b2bua-trunk-edge > siphon-reliable-prov.log 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-b2bua-reliable-prov-logs
          path: siphon-reliable-prov.log
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-reliable-prov down --remove-orphans 2>/dev/null || true

  # ── B2BUA session timers at the RFC 4028 floor ──────────────────────────
  # One call at Session-Expires 90 and Min-SE 90, with a session timer on each
  # dialog. On the callee's, siphon is the refresher and must re-INVITE at half
  # the interval. On the caller's, the caller is, never refreshes, and siphon
  # must end the call 60 s after the answer with a BYE to both legs (RFC 4028
  # §10). Both sides carry assertions with time windows, so a refresh or a BYE
  # that never comes, or comes at the wrong time, fails the run.
  #
  # Its own job because it needs its own siphon instance (a 90 s session_timer,
  # refresher uac) and because the call alone takes about 70 s.
  sipp-b2bua-session-timer-floor:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start siphon-b2bua-session-timer-floor
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-session-timer-floor up -d --wait siphon-b2bua-session-timer-floor

      - name: Callee refreshed at half the interval, both legs BYEd when the caller never refreshes (RFC 4028 §10)
        run: COMPOSE_PROFILES=b2bua-session-timer-floor bash sipp/run_call.sh sipp-b2bua-session-timer-floor-uac sipp-b2bua-session-timer-floor-uas

      - name: Collect siphon logs
        if: always()
        run: docker compose -f sipp/docker-compose.yaml logs siphon-b2bua-session-timer-floor > siphon-session-timer-floor.log 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-b2bua-session-timer-floor-logs
          path: siphon-session-timer-floor.log
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-session-timer-floor down --remove-orphans 2>/dev/null || true

  # ── B2BUA reliable provisionals toward the caller (RFC 3262 §3) ─────────
  # siphon is the caller's UAS, so reliability toward the caller is its own: a
  # provisional goes out reliably on siphon's RSeq when the caller requires
  # 100rel, or supports it and the callee sent that provisional reliably; one
  # reliable provisional at a time; the caller's PRACK answered by siphon; the
  # 2xx held until the PRACK of a reliable provisional that carried SDP.
  #
  # Runs against a dedicated instance pinned to `ims-intra-trust-domain@2026`,
  # whose response policy copies Require and RSeq, so a callee RSeq that leaked
  # through would reach the caller. Two callers, one per rule, each against a
  # fresh callee.
  sipp-b2bua-a-leg-reliable-prov:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start siphon-b2bua-a-leg-reliable
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-a-leg-reliable-prov up -d --wait siphon-b2bua-a-leg-reliable

      - name: Register bob against the instance
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-a-leg-reliable-prov run --rm sipp-b2bua-a-leg-reliable-register

      - name: A caller that requires 100rel gets every provisional reliably, one PRACK at a time
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-a-leg-reliable-prov up --abort-on-container-exit --exit-code-from sipp-b2bua-a-leg-reliable-require-uac sipp-b2bua-a-leg-reliable-require-uac sipp-b2bua-a-leg-reliable-uas

      - name: A caller that supports 100rel gets the callee's reliable 183 on siphon's RSeq
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-a-leg-reliable-prov up --abort-on-container-exit --exit-code-from sipp-b2bua-a-leg-reliable-supported-uac sipp-b2bua-a-leg-reliable-supported-uac sipp-b2bua-a-leg-reliable-uas

      - name: Register carol and dave against the instance
        run: |
          docker compose -f sipp/docker-compose.yaml --profile b2bua-a-leg-reliable-prov run --rm sipp-b2bua-prack-early-offer-register
          docker compose -f sipp/docker-compose.yaml --profile b2bua-a-leg-reliable-prov run --rm sipp-b2bua-prack-offer-register

      - name: The caller's PRACK answers the callee's early offer on siphon's PRACK
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-a-leg-reliable-prov up --abort-on-container-exit --exit-code-from sipp-b2bua-prack-early-offer-uac sipp-b2bua-prack-early-offer-uac sipp-b2bua-prack-early-offer-uas

      - name: An offer in the caller's PRACK is answered in the 200 to it
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-a-leg-reliable-prov up --abort-on-container-exit --exit-code-from sipp-b2bua-prack-offer-uac sipp-b2bua-prack-offer-uac sipp-b2bua-prack-offer-uas

      - name: Register erin against the instance
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-a-leg-reliable-prov run --rm sipp-b2bua-prack-late-offer-register

      - name: An offer in a PRACK after the caller's 2xx reaches the callee in an UPDATE
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-a-leg-reliable-prov up --abort-on-container-exit --exit-code-from sipp-b2bua-prack-late-offer-uac sipp-b2bua-prack-late-offer-uac sipp-b2bua-prack-late-offer-uas

      - name: Collect siphon logs
        if: always()
        run: docker compose -f sipp/docker-compose.yaml logs siphon-b2bua-a-leg-reliable > siphon-a-leg-reliable-prov.log 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-b2bua-a-leg-reliable-prov-logs
          path: siphon-a-leg-reliable-prov.log
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-a-leg-reliable-prov down --remove-orphans 2>/dev/null || true

  # ── B2BUA parallel fork (RFC 3261 §16.7, §9.1, §13.2.2.4) ───────────────
  # call.fork() rings every target and the first answer wins, which puts the
  # hard parts on the branches that do not win. One failing early must not fail
  # the call while another still rings; the rest must be CANCELled once one
  # answers; a loser's 487 and a loser's 2xx both land on a live call and must
  # neither end it nor go unanswered; and when every branch fails the caller
  # gets one final response. Nothing covered any of it, and all of it was broken.
  #
  # Each case is a caller plus two detached callees (see run_case.sh), and the
  # callee scenarios carry most of the assertions.
  sipp-b2bua-fork:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start siphon-b2bua-fork
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-fork up -d --wait siphon-b2bua-fork

      - name: A branch failing does not fail the call while another rings
        run: bash sipp/b2bua-fork/run_case.sh fork-busy b2bua_fork_uac.xml sipp-b2bua-fork-busy-uas sipp-b2bua-fork-late-uas

      - name: Losing branches are CANCELled and their 487 is ACKed on the live call
        run: bash sipp/b2bua-fork/run_case.sh fork-cancel b2bua_fork_uac.xml sipp-b2bua-fork-early-uas sipp-b2bua-fork-cancelled-uas

      - name: A losing branch's 2xx is ACKed and released with a BYE
        run: bash sipp/b2bua-fork/run_case.sh fork-glare b2bua_fork_uac.xml sipp-b2bua-fork-early-uas sipp-b2bua-fork-glare-uas

      - name: Every branch failing gives the caller one final response
        run: bash sipp/b2bua-fork/run_case.sh fork-allfail b2bua_fork_fail_uac.xml sipp-b2bua-fork-busy-uas sipp-b2bua-fork-unavailable-uas

      - name: A ring timeout relays the failure a branch already returned, not a bare 408
        run: bash sipp/b2bua-fork/run_case.sh fork-timeout b2bua_fork_fail_uac.xml sipp-b2bua-fork-busy-uas sipp-b2bua-fork-cancelled-uas

      - name: The lower failure class wins (a 486 over a 503, RFC 3261 16.7)
        run: bash sipp/b2bua-fork/run_case.sh fork-class b2bua_fork_fail_uac.xml sipp-b2bua-fork-busy-uas sipp-b2bua-fork-service-unavailable-uas

      - name: A 503 that is all there is goes upstream as a 500
        run: bash sipp/b2bua-fork/run_case.sh fork-503 b2bua_fork_500_uac.xml sipp-b2bua-fork-service-unavailable-uas

      - name: A redirect wins and keeps the callee's Contact
        run: bash sipp/b2bua-fork/run_case.sh fork-redirect b2bua_fork_redirect_uac.xml sipp-b2bua-fork-busy-uas sipp-b2bua-fork-redirect-uas

      - name: An exhausted sequence sends its best attempt, not its last
        run: bash sipp/b2bua-fork/run_case.sh fork-seqbest b2bua_fork_408_uac.xml sipp-b2bua-fork-cancelled-uas sipp-b2bua-fork-service-unavailable-uas

      # Every case but fork-busy, fork-cancel and fork-glare fails, and
      # @b2bua.on_failure must run once for each: a fork that fired it per
      # failed branch would print more lines here, and one that failed an
      # answerable call would add a line for that case too.
      - name: on_failure ran once for each case that failed
        run: |
          count="$(docker logs siphon-b2bua-fork 2>&1 | grep -c 'FORK-FAILURE' || true)"
          if [ "$count" != "6" ]; then
            echo "@b2bua.on_failure ran $count times, expected 6 (once per failing case)"
            docker logs siphon-b2bua-fork 2>&1 | grep 'FORK-FAILURE' || true
            exit 1
          fi

      - name: Collect siphon logs
        if: always()
        run: docker logs siphon-b2bua-fork > siphon-b2bua-fork.log 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-b2bua-fork-logs
          path: siphon-b2bua-fork.log
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-fork down --remove-orphans 2>/dev/null || true

  # ── B2BUA @b2bua.on_failure decisions ───────────────────────────────────
  # A failure handler that re-dialled, rejected with its own status or answered
  # the caller itself was run and then ignored: the call ended with its failure
  # regardless. Each case fails a call one way (a callee's 486, the ring timeout,
  # an INVITE that never left, an answer @b2bua.on_answer refused) and asserts
  # the caller got what the handler decided. The callees are the fork job's.
  sipp-b2bua-on-failure:
    runs-on: ubuntu-latest
    needs: build-image
    env:
      SIPP_PROFILE: b2bua-on-failure
      SIPP_CALLER: sipp-b2bua-on-failure-uac
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start siphon-b2bua-on-failure
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-on-failure up -d --wait siphon-b2bua-on-failure

      - name: on_failure re-dials a call its callee rejected
        run: bash sipp/b2bua-fork/run_case.sh fail-redial b2bua_fork_uac.xml sipp-b2bua-fork-busy-uas sipp-b2bua-fork-early-uas

      - name: on_failure's reject replaces the callee's failure
        run: bash sipp/b2bua-fork/run_case.sh fail-reject b2bua_on_failure_reject_uac.xml sipp-b2bua-fork-busy-uas

      - name: on_failure re-dials after the ring timeout, and the timed-out callee is CANCELled
        run: bash sipp/b2bua-fork/run_case.sh timeout-redial b2bua_fork_uac.xml sipp-b2bua-fork-cancelled-uas sipp-b2bua-fork-early-uas

      - name: on_failure re-dials a call whose first INVITE never left
        run: bash sipp/b2bua-fork/run_case.sh undialed-redial b2bua_fork_uac.xml sipp-b2bua-fork-early-uas

      - name: on_failure re-dials a call whose answer on_answer refused
        run: bash sipp/b2bua-fork/run_case.sh answer-fail-redial b2bua_fork_uac.xml sipp-b2bua-fork-early-uas sipp-b2bua-fork-late-uas

      - name: on_failure answers the caller itself
        run: bash sipp/b2bua-fork/run_case.sh fail-answer b2bua_fork_uac.xml sipp-b2bua-fork-busy-uas

      # Each case fails once, on the status its first attempt ended with. A
      # second line would be a decision's own routing failing, or a cancelled
      # leg's 487 taken for a failure of the call.
      - name: on_failure ran once per case, with the status each case failed on
        run: |
          logs="$(docker logs siphon-b2bua-on-failure 2>&1)"
          for expected in "fail-redial 486" "fail-reject 486" "timeout-redial 408" "undialed-redial 503" "answer-fail-redial 500" "fail-answer 486"; do
            count="$(grep -c "ON-FAILURE $expected " <<<"$logs" || true)"
            if [ "$count" != "1" ]; then
              echo "expected one 'ON-FAILURE $expected' line, got $count"
              grep 'ON-FAILURE ' <<<"$logs" || true
              exit 1
            fi
          done
          total="$(grep -c 'ON-FAILURE ' <<<"$logs" || true)"
          if [ "$total" != "6" ]; then
            echo "@b2bua.on_failure ran $total times, expected 6 (once per case)"
            grep 'ON-FAILURE ' <<<"$logs" || true
            exit 1
          fi

      - name: Collect siphon logs
        if: always()
        run: docker logs siphon-b2bua-on-failure > siphon-b2bua-on-failure.log 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-b2bua-on-failure-logs
          path: siphon-b2bua-on-failure.log
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-on-failure down --remove-orphans 2>/dev/null || true

  # ── B2BUA LCR route sequence ────────────────────────────────────────────
  # call.route() over the carriers a mock LCR API returns (sipp/b2bua-lcr/),
  # each sent the caller's numbers reshaped by the route's number policy.
  # Carrier A answers 503 and the sequence fails over; carrier B answers 183
  # and then 404, which ends the call. The caller checks that both responses
  # carry its own From and To (RFC 3261 §8.2.6.2) under one To-tag, and that its
  # ACK echoes that To; run_case.sh checks that the 404 reached it only once, so
  # the ACK was absorbed. The loopback scripts/lcr_sipp_test.sh stays a local
  # tool.
  sipp-b2bua-lcr:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start siphon-b2bua-lcr and the mock LCR API
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-lcr up -d --wait siphon-b2bua-lcr b2bua-lcr-api

      - name: The last carrier's failure reaches the caller with the caller's own From and To
        run: bash sipp/b2bua-lcr/run_case.sh b2bua_lcr_relay_identity_uac.xml sipp-b2bua-lcr-carrier-a-uas sipp-b2bua-lcr-carrier-b-uas

      # The route sequence itself: one line per failed carrier, in the order they
      # were tried, and one @b2bua.on_failure for the call, on carrier B's 404.
      - name: Carrier A failed over, carrier B's 404 ended the call
        run: |
          logs="$(docker logs siphon-b2bua-lcr 2>&1)"
          for expected in "LCR-CARRIER-FAILED carrier-a 503" "LCR-CARRIER-FAILED carrier-b 404" "LCR-FAILURE 404 Not Found"; do
            count="$(grep -c "$expected" <<<"$logs" || true)"
            if [ "$count" != "1" ]; then
              echo "expected one '$expected' line, got $count"
              grep 'LCR-' <<<"$logs" || true
              exit 1
            fi
          done

      # The ringing carrier answers 183 and holds: it keeps the call past its 3 s
      # timeout_secs, is CANCELled at the 8 s ring bound, and the untried carrier
      # after it never receives an INVITE.
      - name: A carrier that shows progress keeps the call past its ring timeout
        run: bash sipp/b2bua-lcr/run_case.sh b2bua_lcr_progress_ring_bound_uac.xml sipp-b2bua-lcr-ringing-carrier-uas sipp-b2bua-lcr-untried-carrier-uas

      - name: The ring bound's 408 ended the call once
        run: |
          logs="$(docker logs siphon-b2bua-lcr 2>&1)"
          expected="LCR-FAILURE 408 Request Timeout"
          count="$(grep -c "$expected" <<<"$logs" || true)"
          if [ "$count" != "1" ]; then
            echo "expected one '$expected' line, got $count"
            grep 'LCR-' <<<"$logs" || true
            exit 1
          fi

      # The rejecting carrier answers 503 and the trying carrier, the last one,
      # answers only 100 and rings out at its 3 s timeout_secs, so the caller gets
      # siphon's 503. The rejecting carrier's transaction ended with its 503: the
      # stale 183 it sends afterwards fails the caller if relayed, and it fails
      # itself if a CANCEL, or anything else, reaches it later (RFC 3261 §9.1).
      # The start time is kept so the next step reads this call's siphon lines
      # only: the progress case above logged a failure too.
      - name: A carrier that already failed is not CANCELled when the last carrier rings out
        run: |
          echo "LCR_SETTLED_CASE_SINCE=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)" >> "$GITHUB_ENV"
          bash sipp/b2bua-lcr/run_case.sh b2bua_lcr_last_carrier_rings_out_uac.xml sipp-b2bua-lcr-rejecting-carrier-uas sipp-b2bua-lcr-trying-carrier-uas

      # Each carrier's failure recorded once, in the order tried, through
      # @b2bua.on_route_failure: the 503, then the ring timeout as 408, and only
      # then the call's one @b2bua.on_failure.
      - name: Both carriers' failures were recorded once, the ring timeout before on_failure
        run: |
          # The status and reason the call fails with, as @b2bua.on_failure sees
          # them and the caller is sent; the carriers' own records stay as above.
          call_failure="LCR-FAILURE 503 Service Unavailable"
          events="$(docker logs --since "$LCR_SETTLED_CASE_SINCE" siphon-b2bua-lcr 2>&1 | grep -E 'LCR-(CARRIER-FAILED|FAILURE|NO-ROUTE)' || true)"
          position=1
          for expected in "LCR-CARRIER-FAILED carrier-rejecting 503" "LCR-CARRIER-FAILED carrier-trying 408" "$call_failure"; do
            at="$(grep -n "$expected" <<<"$events" | cut -d: -f1 | paste -sd, - || true)"
            if [ "$at" != "$position" ]; then
              echo "expected one '$expected' line, line $position of this call's LCR lines, got line(s): ${at:-none}"
              echo "$events"
              exit 1
            fi
            position=$((position + 1))
          done
          total="$(grep -c . <<<"$events" || true)"
          if [ "$total" != "3" ]; then
            echo "expected three LCR lines for this call, got $total"
            echo "$events"
            exit 1
          fi

      # A route naming caller_id and a restricted presentation reaches the
      # carrier with a P-Asserted-Identity carrying the presented number, an
      # anonymised From, and Privacy: id. The carrier asserts all three, because
      # it is the only party that sees what actually left siphon — the caller's
      # side of this call is an ordinary answered call and proves nothing about
      # the identity headers.
      - name: A carrier is told who the call is from, and CLIR still withholds it from the From
        run: bash sipp/b2bua-lcr/run_case.sh b2bua_lcr_asserted_identity_uac.xml sipp-b2bua-lcr-asserted-identity-uas

      - name: Collect logs
        if: always()
        run: |
          docker logs siphon-b2bua-lcr > siphon-b2bua-lcr.log 2>&1 || true
          docker logs b2bua-lcr-api > b2bua-lcr-api.log 2>&1 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-b2bua-lcr-logs
          path: |
            siphon-b2bua-lcr.log
            b2bua-lcr-api.log
          if-no-files-found: ignore

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-lcr down -v --remove-orphans 2>/dev/null || true

  # ── B2BUA REFER / call-transfer functional tests ────────────────────────
  # In-dialog REFER on a tracked B2BUA call: transparent forward, loop-safe
  # 603 reject, siphon-terminated transfer (non-anchored), and the terminated
  # transfer re-anchored through a REAL rtpengine (offer/answer on a fresh
  # media session + delete of the old anchor).
  sipp-b2bua-refer:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start siphon-b2bua
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua up -d --wait siphon-b2bua

      - name: B2BUA REFER transparent (RFC 3515 blind transfer, forwarded on the far leg's dialog)
        run: COMPOSE_PROFILES=b2bua,b2bua-refer bash sipp/run_call.sh sipp-b2bua-refer-uac sipp-b2bua-refer-uas

      - name: Cleanup transparent containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-refer rm -sf sipp-b2bua-refer-uac sipp-b2bua-refer-uas 2>/dev/null || true

      - name: Start siphon-b2bua-refer-modes
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-refer-reject up -d --wait siphon-b2bua-refer-modes

      - name: B2BUA REFER reject (loop-safe 603 default, zero egress)
        run: COMPOSE_PROFILES=b2bua-refer-reject bash sipp/run_call.sh sipp-b2bua-refer-reject-uac sipp-b2bua-refer-reject-uas

      - name: Cleanup reject containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-refer-reject rm -sf sipp-b2bua-refer-reject-uac sipp-b2bua-refer-reject-uas 2>/dev/null || true

      # siphon-originated REFER from @b2bua.on_answer. The scenario existed but
      # ran nowhere, and the first time it did it caught a real ordering bug:
      # the deferred call.refer() was emitted where the handler ran, which is
      # before the A-leg 2xx is forwarded, so the caller received an in-dialog
      # REFER for a dialog it had not yet confirmed (RFC 3261 §13.2.2.4).
      - name: B2BUA REFER siphon-originated (REFER follows the 2xx, not before it)
        run: COMPOSE_PROFILES=b2bua-refer-outbound bash sipp/run_call.sh sipp-b2bua-refer-outbound-uac sipp-b2bua-refer-outbound-bob-uas

      - name: Cleanup refer-outbound containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-refer-outbound rm -sf sipp-b2bua-refer-outbound-uac sipp-b2bua-refer-outbound-bob-uas 2>/dev/null || true

      - name: B2BUA REFER siphon-terminated (dial target + promote + BYE)
        run: COMPOSE_PROFILES=b2bua-refer-terminate bash sipp/run_call.sh sipp-b2bua-refer-terminate-uac sipp-b2bua-refer-terminate-bob-uas sipp-b2bua-refer-terminate-carol-uas

      - name: Cleanup terminate containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-refer-terminate rm -sf sipp-b2bua-refer-terminate-uac sipp-b2bua-refer-terminate-bob-uas sipp-b2bua-refer-terminate-carol-uas 2>/dev/null || true

      # The same dial / promote / BYE round with no REFER anywhere: the script
      # arms it from a timer, so nothing on the wire asks for the transfer.
      # Graded per leg rather than on the UAC alone, for the reason the busy
      # step below spells out — a replacement that never happened still lets
      # alice complete her scenario, and lands the damage on bob (never
      # released) and carol (never dialled).
      - name: B2BUA replace_peer (siphon swaps a party, replaced leg held until the target answers)
        run: |
          docker compose -f sipp/docker-compose.yaml --profile b2bua-replace-peer up \
            sipp-b2bua-replace-peer-uac \
            sipp-b2bua-replace-peer-bob-uas \
            sipp-b2bua-replace-peer-carol-uas
          status=0
          for service in uac bob-uas carol-uas; do
            code=$(docker compose -f sipp/docker-compose.yaml --profile b2bua-replace-peer \
              ps -a --format '{{.Service}} {{.ExitCode}}' \
              | awk -v s="sipp-b2bua-replace-peer-$service" '$1 == s { print $2 }')
            echo "sipp-b2bua-replace-peer-$service exit=$code"
            if [ "$code" != "0" ]; then status=1; fi
          done
          exit $status

      - name: Cleanup replace-peer containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-replace-peer rm -sf sipp-b2bua-replace-peer-uac sipp-b2bua-replace-peer-bob-uas sipp-b2bua-replace-peer-carol-uas 2>/dev/null || true

      # Graded per leg for the same reason as the referrer-BYE step below: on a
      # FAILED transfer the referrer and the surviving leg both complete their
      # scenarios cleanly, and the whole of the damage lands on the transfer
      # target — a `Referred-By` that never arrived, and a 486 that is never
      # ACKed. `--exit-code-from` on the UAC alone reports green over both.
      - name: B2BUA REFER terminate, target refuses (RFC 3892 §3 Referred-By + RFC 3261 §17.1.1.3 ACK)
        run: |
          docker compose -f sipp/docker-compose.yaml --profile b2bua-refer-terminate-busy up \
            sipp-b2bua-refer-terminate-busy-uac \
            sipp-b2bua-refer-terminate-busy-bob-uas \
            sipp-b2bua-refer-terminate-busy-carol-uas
          status=0
          for service in uac bob-uas carol-uas; do
            code=$(docker compose -f sipp/docker-compose.yaml --profile b2bua-refer-terminate-busy \
              ps -a --format '{{.Service}} {{.ExitCode}}' \
              | awk -v s="sipp-b2bua-refer-terminate-busy-$service" '$1 == s { print $2 }')
            echo "sipp-b2bua-refer-terminate-busy-$service exit=$code"
            if [ "$code" != "0" ]; then status=1; fi
          done
          exit $status

      - name: Cleanup terminate-busy containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-refer-terminate-busy rm -sf sipp-b2bua-refer-terminate-busy-uac sipp-b2bua-refer-terminate-busy-bob-uas sipp-b2bua-refer-terminate-busy-carol-uas 2>/dev/null || true

      # Every leg is graded, NOT just the UAC. The referrer completes its own
      # scenario cleanly even when the transfer is broken — the damage lands on
      # the surviving leg (an unexpected BYE) and on the transfer target (a 200
      # that is never ACKed), so `--exit-code-from` on the UAC alone reports a
      # green run over both failures. All three scenarios self-terminate, so
      # plain `up` returns once they have, and each exit code is then asserted.
      - name: B2BUA REFER terminate, referrer BYEs mid-transfer (RFC 5589 §7 — survivor kept, target ACKed)
        run: |
          docker compose -f sipp/docker-compose.yaml --profile b2bua-refer-referrer-bye up \
            sipp-b2bua-refer-referrer-bye-uac \
            sipp-b2bua-refer-referrer-bye-bob-uas \
            sipp-b2bua-refer-referrer-bye-carol-uas
          status=0
          for service in uac bob-uas carol-uas; do
            code=$(docker compose -f sipp/docker-compose.yaml --profile b2bua-refer-referrer-bye \
              ps -a --format '{{.Service}} {{.ExitCode}}' \
              | awk -v s="sipp-b2bua-refer-referrer-bye-$service" '$1 == s { print $2 }')
            echo "sipp-b2bua-refer-referrer-bye-$service exit=$code"
            if [ "$code" != "0" ]; then status=1; fi
          done
          exit $status

      - name: Cleanup referrer-bye containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-refer-referrer-bye rm -sf sipp-b2bua-refer-referrer-bye-uac sipp-b2bua-refer-referrer-bye-bob-uas sipp-b2bua-refer-referrer-bye-carol-uas 2>/dev/null || true

      - name: B2BUA REFER terminate attended (RFC 3891 §3 — Replaces reaches the target's INVITE)
        run: COMPOSE_PROFILES=b2bua-refer-attended bash sipp/run_call.sh sipp-b2bua-refer-attended-uac sipp-b2bua-refer-attended-bob-uas sipp-b2bua-refer-attended-carol-uas

      - name: Cleanup attended containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-refer-attended rm -sf sipp-b2bua-refer-attended-uac sipp-b2bua-refer-attended-bob-uas sipp-b2bua-refer-attended-carol-uas 2>/dev/null || true

      # Inbound INVITE with Replaces: the transferee calls in naming the dialog
      # it is taking over. The peer plays all three parties and prints one
      # verdict line; grep it rather than trusting the exit code alone, so a
      # peer that dies before running its assertions cannot read as a pass.
      - name: B2BUA inbound Replaces takeover (RFC 3891 §3 — replaced party released, survivor re-INVITEd)
        run: |
          docker compose -f sipp/docker-compose.yaml --profile b2bua-replaces up -d --wait siphon-b2bua-replaces
          docker compose -f sipp/docker-compose.yaml --profile b2bua-replaces up \
            --abort-on-container-exit --exit-code-from replaces-takeover-peer \
            replaces-takeover-peer | tee replaces-verdict.log
          grep -q 'REPLACES-VERDICT .*"ok": true' replaces-verdict.log

      # The callee's ACK. Its own gate because nothing else catches it: the
      # failure is invisible on the caller's side, and it only appears when a
      # call's 18x and its 200 are handled concurrently, which the scenario
      # files never produce. Greps the verdict so a peer that dies before
      # asserting cannot read as a pass.
      - name: B2BUA callee is ACKed on every answered call (RFC 3261 §13.2.2.4)
        run: |
          docker compose -f sipp/docker-compose.yaml --profile b2bua-bleg-ack up -d --wait siphon-b2bua-replaces
          docker compose -f sipp/docker-compose.yaml --profile b2bua-bleg-ack up \
            --abort-on-container-exit --exit-code-from bleg-ack-peer \
            bleg-ack-peer | tee bleg-ack.log
          grep -q 'ACK-REPRO .*"failures": 0' bleg-ack.log

      - name: Cleanup bleg-ack containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-bleg-ack rm -sf bleg-ack-peer 2>/dev/null || true

      - name: Cleanup replaces containers
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-replaces rm -sf replaces-takeover-peer siphon-b2bua-replaces 2>/dev/null || true

      - name: B2BUA REFER terminate + REAL rtpengine (media re-anchor offer/answer/delete)
        run: COMPOSE_PROFILES=b2bua-rtpengine-refer bash sipp/run_call.sh sipp-anchored-refer-uac sipp-anchored-refer-bob-uas sipp-anchored-refer-carol-uas

      - name: Collect logs
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs siphon-b2bua > siphon-b2bua-refer.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs siphon-b2bua-refer-modes >> siphon-b2bua-refer.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs siphon-b2bua-rtpengine-refer >> siphon-b2bua-refer.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs rtpengine-real > rtpengine-real.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua --profile b2bua-refer --profile b2bua-refer-reject --profile b2bua-refer-terminate --profile b2bua-refer-referrer-bye --profile b2bua-refer-attended --profile b2bua-replaces --profile b2bua-bleg-ack --profile b2bua-rtpengine-refer down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-b2bua-refer-logs
          path: |
            siphon-b2bua-refer.log
            rtpengine-real.log
            *.log

  # ── Control-plane `originate` (a call siphon places itself) ─────────────
  # No inbound call anywhere: a control application dials siphon's control
  # WebSocket and places a call under a channel id IT chose.
  #
  # The two halves of the acceptance criteria live on opposite sides of the
  # rail, so both have to pass:
  #   * the UAS asserts the outbound identity actually reached the wire (From +
  #     display, P-Asserted-Identity, custom header, the caller-supplied offer,
  #     no To-tag) and then holds `180 Ringing` for two seconds;
  #   * the app asserts its accept came back during that ring rather than after
  #     the answer, that the reply echoes its own id, that a duplicate id is
  #     refused `conflict`, and that hangup produces the `StasisEnd`.
  #
  # The app prints one ORIGINATE-VERDICT line; the grep below fails the job on
  # `"pass": false` AND on a verdict that never appeared (the app never
  # connecting at all looks like success to `--exit-code-from` alone only if it
  # exits 0, which it does not — but the grep is the belt to that braces).
  sipp-originate:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start siphon (control listener) + the UAS
        run: docker compose -f sipp/docker-compose.yaml --profile originate up -d --wait siphon-originate

      - name: Originate under a caller-supplied id, ring, answer, bridge-free hangup
        run: docker compose -f sipp/docker-compose.yaml --profile originate up --abort-on-container-exit --exit-code-from originate-app sipp-originate-uas originate-app

      - name: Assert the control app's verdict
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs originate-app > originate-app.log 2>&1 || true
          grep -q 'ORIGINATE-VERDICT' originate-app.log || { echo "no verdict — the control app never completed"; exit 1; }
          if grep -q '"pass": false' originate-app.log; then
            echo "originate acceptance checks failed:"; grep 'ORIGINATE-VERDICT' originate-app.log; exit 1
          fi
          grep 'ORIGINATE-VERDICT' originate-app.log

      - name: Collect logs
        if: always()
        run: docker compose -f sipp/docker-compose.yaml logs siphon-originate > siphon-originate.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile originate down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-originate-logs
          path: |
            siphon-originate.log
            originate-app.log
            *.log

  # ── `bridge`: joining two legs siphon already owns ─────────────────────
  # A controller answers an inbound call, places a second one, joins the two,
  # parts them and joins them again. Three oracles, because none of them can see
  # the whole thing on its own:
  #
  #   * the SIPp scenarios decide the run and assert the SIP wire — the media
  #     moved onto the engine, the unbridge held each leg with `a=sendonly`
  #     (RFC 3264 §8.4), the re-bridge lifted it, and the surviving leg got a
  #     BYE nobody sent it explicitly (the peer-hangup policy);
  #   * the application's verdict covers the verb contract — seven typed
  #     refusals, each with its own code, and `ChannelBridged` on BOTH channels
  #     rather than the reply pretending to be the outcome;
  #   * the MEDIA CDR carries the engine's per-leg packet counters, and all four
  #     of in/out on both legs is the only evidence that the two parties heard
  #     each other. Everything else here passes just as happily on a bridge that
  #     connected and carries no audio.
  #
  # This runs against the real siphon-rtp engine on purpose: the mock records
  # commands but relays no RTP, and the audio is the point.
  sipp-bridge:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      # --wait on the application as well: siphon parks a handed-over call only
      # while a controller is connected, so a caller that dials before the app
      # is up gets the handoff default and the run fails for the wrong reason.
      - name: Start the media engine, siphon and the control application
        run: docker compose -f sipp/docker-compose.yaml --profile bridge up -d --force-recreate --wait siphon-rtp-engine siphon-bridge bridge-app

      - name: Start the callee
        run: docker compose -f sipp/docker-compose.yaml --profile bridge up -d --force-recreate sipp-bridge-uas

      # Exactly one foreground container, and it is the one that finishes last:
      # the callee's BYE assertion and the application's verdict both land while
      # the caller is still in its trailing pause.
      - name: Join two owned legs, part them, join them again
        run: docker compose -f sipp/docker-compose.yaml --profile bridge up --abort-on-container-exit --exit-code-from sipp-bridge-uac sipp-bridge-uac

      # The callee ran detached, so without this its scenario could fail and the
      # job would still be green.
      - name: Assert the callee scenario passed
        run: |
          code="$(docker wait sipp-bridge-uas)"
          if [ "$code" != "0" ]; then
            echo "the callee scenario exited $code"
            docker compose -f sipp/docker-compose.yaml logs sipp-bridge-uas | tail -60
            exit 1
          fi

      - name: Assert the control application's verdict
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs bridge-app > bridge-app.log 2>&1 || true
          grep -q 'BRIDGE-VERDICT' bridge-app.log || { echo "no verdict — the control application never completed"; exit 1; }
          if grep -q '"pass": false' bridge-app.log; then
            echo "bridge acceptance checks failed:"; grep 'BRIDGE-VERDICT' bridge-app.log; exit 1
          fi
          grep 'BRIDGE-VERDICT' bridge-app.log

      - name: Assert audio flowed both ways across the bridge
        run: docker compose -f sipp/docker-compose.yaml --profile bridge run --rm bridge-cdr-assert

      - name: Assert the engine accepted every command the bridge sent
        run: docker compose -f sipp/docker-compose.yaml --profile bridge run --rm --entrypoint python3 bridge-cdr-assert /app/assert_media.py metrics --url http://172.20.0.130:9091/metrics --min-offers 1 --min-answers 1 --max-offers 1 --min-deletes 1 --max-control-errors 0 --max-sessions 0

      - name: Collect logs
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs siphon-bridge > siphon-bridge.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs sipp-bridge-uas > sipp-bridge-uas.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs siphon-rtp-engine > siphon-rtp-engine.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile bridge down --remove-orphans -v

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-bridge-logs
          path: |
            siphon-bridge.log
            bridge-app.log
            sipp-bridge-uas.log
            siphon-rtp-engine.log
            *.log

  # ── Control plane: the external application rail ────────────────────────
  # An out-of-process application drives real calls over a real WebSocket. Five
  # cases against one siphon, both connection modes at once (per-call-connect,
  # which siphon dials, and persistent-inbound, which dials siphon), because
  # ownership round-robin and `resync` only exist in the second.
  #
  # Each SIPp scenario is the decider for its own step. What the SIP wire cannot
  # show is asserted on the recorded frames afterwards, and that half is not
  # optional: the media step below passes on the wire AND in the application's
  # own reply even when the verb was accepted and never performed — only the
  # media engine's record catches that.
  #
  # The `grep` patterns carry the space in `"key": "value"` because that is what
  # `json.dumps` writes; without it they match nothing.
  sipp-control:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      # --force-recreate keeps the set coherent: the persistent app dials siphon
      # once at start-up and holds its sockets for life, so an app reused across
      # a recreated siphon would be connected to nothing.
      - name: Start siphon, both control applications and the media engine
        run: docker compose -f sipp/docker-compose.yaml --profile control up -d --force-recreate --wait mock-control-rtp control-app-edge siphon-control control-app-ivr

      # A second siphon, because the script-free path is about the ABSENCE of a
      # routing decision and the instance above registers @b2bua.on_invite.
      - name: Start the script-free siphon and its application
        run: docker compose -f sipp/docker-compose.yaml --profile control up -d --force-recreate --wait control-app-inbound siphon-control-inbound

      - name: Deferred handover — siphon parks the INVITE, the app answers it
        run: docker compose -f sipp/docker-compose.yaml --profile control up --abort-on-container-exit --exit-code-from sipp-control-handover-uac sipp-control-handover-uac

      - name: Handover from on_failure — the dial fails, the failure handler hands the call over, the app answers it
        run: docker compose -f sipp/docker-compose.yaml --profile control up --abort-on-container-exit --exit-code-from sipp-control-failure-handover-uac sipp-control-failure-handover-uac

      - name: Handoff deadline — the controller never acts, siphon applies its default
        run: docker compose -f sipp/docker-compose.yaml --profile control up --abort-on-container-exit --exit-code-from sipp-control-deadline-uac sipp-control-deadline-uac

      - name: Media verbs on an answer-first channel
        run: docker compose -f sipp/docker-compose.yaml --profile control up --abort-on-container-exit --exit-code-from sipp-control-media-uac sipp-control-media-uac

      - name: Hold, resume and a session refresh on a one-legged anchored call
        run: docker compose -f sipp/docker-compose.yaml --profile control up --abort-on-container-exit --exit-code-from sipp-control-hold-uac sipp-control-hold-uac

      - name: In-dialog INFO on a one-legged call — answered, digits surfaced
        run: docker compose -f sipp/docker-compose.yaml --profile control up --abort-on-container-exit --exit-code-from sipp-control-info-uac sipp-control-info-uac

      - name: No script at all — control.inbound hands the call to the app
        run: docker compose -f sipp/docker-compose.yaml --profile control up --abort-on-container-exit --exit-code-from sipp-control-inbound-uac sipp-control-inbound-uac

      - name: Recording verbs on a leg anchored with no WebSocket bridge
        run: docker compose -f sipp/docker-compose.yaml --profile control up --abort-on-container-exit --exit-code-from sipp-control-record-uac sipp-control-record-uac

      - name: Early media anchored on the engine, played into, then answered
        run: docker compose -f sipp/docker-compose.yaml --profile control up --abort-on-container-exit --exit-code-from sipp-control-early-uac sipp-control-early-uac

      - name: dial — the caller survives a failed ring and the app answers it
        run: docker compose -f sipp/docker-compose.yaml --profile control up --abort-on-container-exit --exit-code-from sipp-control-dial-uac sipp-control-dial-uac

      - name: Exactly-one-owner dispatch across several app connections
        run: docker compose -f sipp/docker-compose.yaml --profile control up --abort-on-container-exit --exit-code-from sipp-control-owner-uac sipp-control-owner-uac

      - name: Resync — the owner drops, reconnects in the grace window, re-claims
        run: docker compose -f sipp/docker-compose.yaml --profile control up --abort-on-container-exit --exit-code-from sipp-control-resync-uac sipp-control-resync-uac

      - name: Assert the recorded control frames
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs control-app-edge > control-app-edge.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs control-app-ivr > control-app-ivr.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs mock-control-rtp > mock-control-rtp.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs control-app-inbound > control-app-inbound.log 2>&1 || true
          fail=0
          assert_verdict() {
            local case="$1" log="$2" line
            line="$(grep 'CONTROL-VERDICT' "$log" 2>/dev/null | grep "\"case\": \"$case\"" || true)"
            if [ -z "$line" ]; then
              echo "no CONTROL-VERDICT for case '$case' — the control app never completed it"
              fail=1
              return
            fi
            if echo "$line" | grep -q '"pass": false'; then
              echo "control-plane case '$case' failed:"
              echo "$line"
              fail=1
              return
            fi
            echo "ok: control case '$case'"
          }
          assert_performed() {
            local verb="$1"
            if ! grep -q "\"command\": \"$verb\"" mock-control-rtp.log; then
              echo "the media engine never received '$verb' — the verb was accepted but never performed"
              fail=1
              return
            fi
            echo "ok: media engine performed '$verb'"
          }
          assert_verdict handover control-app-edge.log
          assert_verdict failure-handover control-app-edge.log
          assert_verdict deadline control-app-ivr.log
          assert_verdict media    control-app-edge.log
          assert_verdict info     control-app-edge.log
          assert_verdict record   control-app-edge.log
          assert_verdict early    control-app-edge.log
          assert_verdict owner    control-app-ivr.log
          assert_verdict resync   control-app-ivr.log
          assert_verdict inbound  control-app-inbound.log
          assert_verdict dial     control-app-edge.log
          assert_performed play_media
          assert_performed stop_media
          assert_performed start_recording
          assert_performed stop_recording
          # The handle on the stop itself, not just the verb: the engine
          # refuses an id it never issued, so a siphon that dropped it would
          # have stopped every recording on the call and still looked correct
          # from the reply. Matched on the stop_recording line specifically —
          # the pushed RecordingFinished carries the same field.
          if ! grep '"command": "stop_recording"' mock-control-rtp.log | grep -q '"recording_id": "rec-'; then
            echo "stop_recording carried no engine-issued recording_id"
            fail=1
          fi
          # Exactly one anchor for the early-media call. The mock engine hands out
          # a fresh port on every answer_local, so a second one would mean the 200
          # carried a different media port than the 183 the caller accepted —
          # while still naming the same address, which is all SIPp can see.
          early_anchors=$(grep '"command": "answer_local"' mock-control-rtp.log | grep -c '@172.20.0.179' || true)
          if [ "$early_anchors" != "1" ]; then
            echo "early-media call anchored $early_anchors times, expected exactly 1"
            fail=1
          else
            echo "ok: early-media call anchored exactly once"
          fi
          exit $fail

      - name: Collect logs
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs siphon-control > siphon-control.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs siphon-control-inbound > siphon-control-inbound.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile control down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-control-logs
          path: |
            siphon-control.log
            siphon-control-inbound.log
            control-app-edge.log
            control-app-ivr.log
            control-app-inbound.log
            mock-control-rtp.log
            *.log

  # ── B2BUA A-leg INVITE authentication ──────────────────────────────────
  # siphon challenges the CALLER from @b2bua.on_invite. With a @b2bua handler
  # registered the dispatcher routes INVITE to the B2BUA path and
  # @proxy.on_request never sees it, so the challenge runs against the Call
  # object (auth.require_proxy_digest(call, realm=...)).
  #
  # The UAC asserts siphon's own 407 carries a Proxy-Authenticate challenge and
  # a UAS To-tag, then completes the authenticated re-INVITE end to end. The UAS
  # runs with -m 1 and asserts no Proxy-Authorization crossed the B2BUA, so a
  # build that cannot challenge (dialling the unauthenticated INVITE through)
  # fails on the extra INVITE.
  sipp-b2bua-invite-auth:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start siphon-b2bua-invite-auth
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-invite-auth up -d --wait siphon-b2bua-invite-auth

      - name: B2BUA A-leg INVITE auth (407 from siphon, then the authenticated re-INVITE bridges)
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-invite-auth up --abort-on-container-exit --exit-code-from sipp-b2bua-invite-auth-uac sipp-b2bua-invite-auth-uac sipp-b2bua-invite-auth-uas

      - name: Collect logs
        if: always()
        run: docker compose -f sipp/docker-compose.yaml logs siphon-b2bua-invite-auth > siphon-b2bua-invite-auth.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile b2bua-invite-auth down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-b2bua-invite-auth-logs
          path: |
            siphon-b2bua-invite-auth.log
            *.log

  # ── rtpproxy functional test ───────────────────────────────────────────
  # Drives a real INVITE→200→ACK→BYE through siphon configured with
  # `media.backend: rtpproxy`, anchoring media via a mock rtpproxy. Proves the
  # text-protocol client + siphon-side SDP rewrite work end-to-end.
  sipp-rtpproxy:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start mock rtpproxy + siphon-rtpproxy
        run: docker compose -f sipp/docker-compose.yaml --profile rtpproxy up -d --wait mock-rtpproxy siphon-rtpproxy

      - name: Register bob
        run: docker compose -f sipp/docker-compose.yaml --profile rtpproxy run --rm sipp-rtpproxy-register

      - name: rtpproxy call (INVITE → media anchor → 200 → BYE)
        # Gate on the UAC: it drives the call to completion (BYE→200) and exits
        # 0, after which the abort tears down the lingering UAS (which would
        # otherwise show a teardown-race 255). --exit-code-from makes the UAC's
        # result authoritative — same pattern as the b2bua call steps.
        run: docker compose -f sipp/docker-compose.yaml --profile rtpproxy up --abort-on-container-exit --exit-code-from sipp-rtpproxy-uac sipp-rtpproxy-uac sipp-rtpproxy-uas

      - name: Collect logs
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs siphon-rtpproxy > siphon-rtpproxy.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs mock-rtpproxy > mock-rtpproxy.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile rtpproxy down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-rtpproxy-logs
          path: |
            siphon-rtpproxy.log
            mock-rtpproxy.log
            *.log

  # ── Voice-AI B2BUA (single-leg answer + WebSocket bridge) ──────────────
  sipp-voice-ai:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start mock siphon-rtp + siphon-voice-ai
        run: docker compose -f sipp/docker-compose.yaml --profile voice-ai up -d --wait mock-siphon-rtp siphon-voice-ai

      - name: Voice-AI call (INVITE → answer_local → 200 → BYE)
        # No UAS and no register: siphon answers the call itself as a single-leg
        # UAS, so the UAC is the only party. The scenario asserts the answer SDP
        # is anchored on the engine's media address and that the 2xx carries a
        # Contact (RFC 3261 §12.1.1) — without one the UAC has no remote target
        # and the BYE goes out with an empty Request-URI.
        run: docker compose -f sipp/docker-compose.yaml --profile voice-ai up --abort-on-container-exit --exit-code-from sipp-voice-ai-uac sipp-voice-ai-uac

      - name: Collect logs
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs siphon-voice-ai > siphon-voice-ai.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs mock-siphon-rtp > mock-siphon-rtp.log 2>&1 || true

      # The engine keys call ownership on this, so a siphon that never presents
      # it comes back from a restart as a different owner and cannot reach the
      # sessions its previous run created. A unit test pins the frame's shape;
      # only this proves it reaches an engine on a real connection — and this
      # backend configures no control secret, which is exactly the case that
      # used to send no frame at all.
      - name: Assert siphon presented a control identity
        run: |
          if ! grep -q '"command": "authenticate"' mock-siphon-rtp.log; then
            echo "siphon opened the control connection without an authenticate frame"
            exit 1
          fi
          if ! grep '"command": "authenticate"' mock-siphon-rtp.log | grep -q '"controller_id"'; then
            echo "the authenticate frame carried no controller_id"
            exit 1
          fi

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile voice-ai down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-voice-ai-logs
          path: |
            siphon-voice-ai.log
            mock-siphon-rtp.log

  # ── Re-INVITE renegotiation on the siphon-rtp backend ──────────────────
  sipp-ws-bridge:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start mock siphon-rtp + siphon
        run: docker compose -f sipp/docker-compose.yaml --profile ws-bridge up -d --wait mock-siphon-rtp-ws-bridge siphon-ws-bridge

      - name: Register bob
        run: docker compose -f sipp/docker-compose.yaml --profile ws-bridge run --rm sipp-ws-bridge-register

      - name: Call, attach, re-point, detach, hang up
        run: docker compose -f sipp/docker-compose.yaml --profile ws-bridge up --abort-on-container-exit --exit-code-from sipp-ws-bridge-uac sipp-ws-bridge-uac sipp-ws-bridge-uas

      - name: Assert the re-point never dropped the media path
        # SIPp cannot tell the two apart — the call answers and hangs up the
        # same either way. The difference is on the control channel: moving a
        # party between media servers must be a second `attach_ws_bridge`, and
        # a `detach_ws_bridge` appearing *between* the two attaches means the
        # media path went back to the relay for as long as the next attach took
        # to land, which the other party hears as a gap.
        run: |
          verbs="$(docker compose -f sipp/docker-compose.yaml --profile ws-bridge logs --no-log-prefix mock-siphon-rtp-ws-bridge \
            | grep -oE '"command": ?"[a-z_]+"' | sed -E 's/"command": ?"//; s/"//' | grep -E '^(attach_ws_bridge|detach_ws_bridge)$' || true)"
          echo "bridge verbs seen:"
          printf '%s\n' "$verbs"
          expected="$(printf 'attach_ws_bridge\nattach_ws_bridge\ndetach_ws_bridge')"
          test "$verbs" = "$expected" || {
            echo "::error::expected attach,attach,detach — got: $(printf '%s' "$verbs" | tr '\n' ',')"
            exit 1
          }

      - name: Assert the engine never refused a bridge verb
        # The mock refuses a detach on a call with no bridge, and refuses any
        # verb it does not model. Either would mean siphon sent something the
        # real engine would have rejected, on a call that looked fine to SIPp.
        run: |
          if docker compose -f sipp/docker-compose.yaml --profile ws-bridge logs --no-log-prefix mock-siphon-rtp-ws-bridge | grep -q '"refused"'; then
            echo "::error::the mock engine refused a command siphon sent"
            docker compose -f sipp/docker-compose.yaml --profile ws-bridge logs --no-log-prefix mock-siphon-rtp-ws-bridge | grep '"refused"'
            exit 1
          fi

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f sipp/docker-compose.yaml --profile ws-bridge logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile ws-bridge down -v

  sipp-reoffer:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start mock siphon-rtp + siphon
        run: docker compose -f sipp/docker-compose.yaml --profile reoffer up -d --wait mock-siphon-rtp-reoffer siphon-reoffer

      - name: Register bob
        run: docker compose -f sipp/docker-compose.yaml --profile reoffer run --rm sipp-reoffer-register

      - name: Call, hold, resume, hang up
        run: docker compose -f sipp/docker-compose.yaml --profile reoffer up --abort-on-container-exit --exit-code-from sipp-reoffer-uac sipp-reoffer-uac sipp-reoffer-uas

      - name: Assert the re-INVITEs renegotiated in place
        # SIPp cannot tell the two apart — a replacement answers the re-INVITE
        # with a 200 just as a renegotiation does. The difference is the verb on
        # the control channel, and a second `offer` means the media session was
        # replaced: fresh ports, and any WebSocket bridge, tee or SIPREC fork on
        # it torn down while the call carried on.
        run: |
          verbs="$(docker compose -f sipp/docker-compose.yaml --profile reoffer logs --no-log-prefix mock-siphon-rtp-reoffer \
            | grep -oE '"command": ?"[a-z_]+"' | sed -E 's/"command": ?"//; s/"//' | grep -E '^(offer|reoffer)$' || true)"
          offers="$(printf '%s\n' "$verbs" | grep -c '^offer$' || true)"
          reoffers="$(printf '%s\n' "$verbs" | grep -c '^reoffer$' || true)"
          echo "control verbs: offer=$offers reoffer=$reoffers"
          test "$offers" -eq 1 || { echo "::error::expected 1 offer, got $offers — a re-INVITE replaced the media session"; exit 1; }
          test "$reoffers" -ge 2 || { echo "::error::expected >=2 reoffers (hold + resume), got $reoffers"; exit 1; }

      - name: Collect logs
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs siphon-reoffer > siphon-reoffer.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs mock-siphon-rtp-reoffer > mock-siphon-rtp-reoffer.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile reoffer down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-reoffer-logs
          path: |
            siphon-reoffer.log
            mock-siphon-rtp-reoffer.log

  # ── Cold transfer off a single-leg answered call ───────────────────────
  sipp-refer-single-leg:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start mock siphon-rtp + siphon-refer
        run: docker compose -f sipp/docker-compose.yaml --profile refer-single-leg up -d --wait mock-siphon-rtp-refer siphon-refer

      - name: Cold transfer (answer_local → in-dialog REFER → 202 → NOTIFY)
        run: docker compose -f sipp/docker-compose.yaml --profile refer-single-leg up --abort-on-container-exit --exit-code-from sipp-refer-single-leg-uac sipp-refer-single-leg-uac

      - name: Challenged REFER (407 → credentialed retry)
        # The retry only exists because a REFER siphon originates carries a
        # branch belonging to no leg; without tracking it, the 407 matched
        # nothing and the transfer failed silently.
        run: docker compose -f sipp/docker-compose.yaml --profile refer-single-leg up --abort-on-container-exit --exit-code-from sipp-refer-challenge-uac sipp-refer-challenge-uac

      - name: Collect logs
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs siphon-refer > siphon-refer.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs mock-siphon-rtp-refer > mock-siphon-rtp-refer.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile refer-single-leg down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-refer-single-leg-logs
          path: |
            siphon-refer.log
            mock-siphon-rtp-refer.log


  # ── Cx end-to-end: a Diameter request against a peer on the wire ────────
  # The only job that exercises the Diameter request path outside unit tests.
  # The I-CSCF's REGISTER handler awaits `diameter.cx_uar`; the REGISTER can
  # only reach the S-CSCF below if that coroutine resolved and its Server-Name
  # was read, because the script's SCSCF_FALLBACK names a host that does not
  # exist on this network.
  sipp-cx-icscf:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start the mock HSS and the I-CSCF
        run: docker compose -f sipp/docker-compose.yaml --profile cx up -d --wait siphon-cx-hss siphon-cx-icscf

      - name: REGISTER routed via Cx UAR
        run: docker compose -f sipp/docker-compose.yaml --profile cx up --abort-on-container-exit --exit-code-from sipp-cx-uac sipp-cx-scscf sipp-cx-uac

      - name: Collect logs
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs siphon-cx-icscf > siphon-cx-icscf.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs siphon-cx-hss > siphon-cx-hss.log 2>&1 || true

      # Belt and braces on top of the SIPp result: name the two sides of the
      # exchange in the logs, so a pass cannot come from the fallback path.
      - name: Assert the answer came from the HSS and was used
        run: |
          if ! grep -q "HSS: UAR for" siphon-cx-hss.log; then
            echo "the HSS never answered a UAR — the I-CSCF did not send one"
            exit 1
          fi
          if ! grep -q "UAR -> S-CSCF: sip:172.20.0.76:6060" siphon-cx-icscf.log; then
            echo "the I-CSCF did not read the Server-Name out of the Cx answer"
            exit 1
          fi

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile cx down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-cx-icscf-logs
          path: |
            siphon-cx-icscf.log
            siphon-cx-hss.log


  # ── Real siphon-rtp: control-plane smoke (both front-ends) ─────────────
  # Runs the end-to-end test that was previously #[ignore]d behind
  # SIPHON_RTP_BIN with the note "CI does not build the engine". It still does
  # not: the published image is distroless with a *static musl* binary, so the
  # binary is copied out and run bare on the runner. That covers both control
  # planes (RtpEngineSet → --ng, SiphonRtpClient → --control) in ~2s with no
  # container networking and no Rust build of the engine.
  siphon-rtp-engine-smoke:
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.14 (free-threaded)
        uses: deadsnakes/action@v3.2.0
        with:
          python-version: "3.14-dev"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Extract the siphon-rtp binary from the published image
        # Pinned to the release siphon pins siphon-rtp-proto to, so this proves
        # a known-good pairing rather than whatever shipped most recently.
        run: |
          docker create --name rtp-extract ghcr.io/siphon-project/siphon-rtp:0.7.1
          docker cp rtp-extract:/usr/local/bin/siphon-rtp ./siphon-rtp
          docker rm rtp-extract
          chmod +x ./siphon-rtp
          ./siphon-rtp --help > /dev/null

      - name: Smoke test against the real engine (NG + native control)
        run: |
          SIPHON_RTP_BIN="$PWD/siphon-rtp" PYO3_PYTHON=python3.14 \
            cargo test --test integration_tests -- --ignored --exact \
            siphon_rtp_tests::smoke_test_against_real_siphon_rtp --nocapture

  # ── Real siphon-rtp: native JSON control plane ─────────────────────────
  # The media-anchoring analogue of sipp-rtpproxy, but against the real engine
  # instead of a mock: INVITE → offer → 200 → answer → BYE → delete, driven
  # through `media.backend: siphon-rtp`.
  #
  # The mock profiles (voice-ai, refer-single-leg) stay as they are. They assert
  # on what siphon *sent*, which the real engine cannot report; this asserts the
  # complementary half, that a real engine accepts it.
  sipp-siphon-rtp-native:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start the real engine + siphon
        run: docker compose -f sipp/docker-compose.yaml --profile siphon-rtp-native up -d --wait siphon-rtp-engine siphon-rtp-native

      - name: Register bob
        run: docker compose -f sipp/docker-compose.yaml --profile siphon-rtp-native run --rm sipp-rtp-native-register

      - name: Anchored call (INVITE → offer → 200 → answer → BYE → delete)
        run: docker compose -f sipp/docker-compose.yaml --profile siphon-rtp-native up --abort-on-container-exit --exit-code-from sipp-rtp-native-uac sipp-rtp-native-uac sipp-rtp-native-uas

      - name: Assert the engine accepted every command
        # The independent oracle. A green call flow only proves siphon liked the
        # answers it got; control_errors_total proves the engine did not reject
        # anything on the way. That distinction caught a real profile mismatch
        # (an SRTP offer answered in plain RTP) that the SIP leg reported as a
        # perfectly successful call.
        run: |
          docker run --rm --network sipp_sipnet -v "$PWD/sipp:/app:ro" python:3.12-slim \
            python3 /app/assert_media.py metrics \
              --url http://172.20.0.130:9091/metrics \
              --min-offers 1 --min-answers 1 --min-deletes 1 \
              --max-control-errors 0 --max-sessions 0

      - name: Collect logs
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs siphon-rtp-native > siphon-rtp-native.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs siphon-rtp-engine > siphon-rtp-engine.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile siphon-rtp-native down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-siphon-rtp-native-logs
          path: |
            siphon-rtp-native.log
            siphon-rtp-engine.log
            *.log

  # ── Real siphon-rtp: rtpengine NG shim (drop-in replacement) ───────────
  # Same script, same scenarios, same assertions as sipp-siphon-rtp-native —
  # only the media backend differs. siphon's stock rtpengine client drives
  # siphon-rtp's --ng listener, with a config block an operator could lift
  # straight from an existing rtpengine deployment.
  sipp-siphon-rtp-ng:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start the real engine + siphon
        run: docker compose -f sipp/docker-compose.yaml --profile siphon-rtp-ng up -d --wait siphon-rtp-engine siphon-rtp-ng

      - name: Register bob
        run: docker compose -f sipp/docker-compose.yaml --profile siphon-rtp-ng run --rm sipp-rtp-ng-register

      - name: Anchored call over the NG shim
        run: docker compose -f sipp/docker-compose.yaml --profile siphon-rtp-ng up --abort-on-container-exit --exit-code-from sipp-rtp-ng-uac sipp-rtp-ng-uac sipp-rtp-ng-uas

      - name: Assert the engine accepted every command
        run: |
          docker run --rm --network sipp_sipnet -v "$PWD/sipp:/app:ro" python:3.12-slim \
            python3 /app/assert_media.py metrics \
              --url http://172.20.0.130:9091/metrics \
              --min-offers 1 --min-answers 1 --min-deletes 1 \
              --max-control-errors 0 --max-sessions 0

      - name: Collect logs
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs siphon-rtp-ng > siphon-rtp-ng.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs siphon-rtp-engine > siphon-rtp-engine-ng.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile siphon-rtp-ng down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-siphon-rtp-ng-logs
          path: |
            siphon-rtp-ng.log
            siphon-rtp-engine-ng.log
            *.log

  # ── Real siphon-rtp: voice-AI WebSocket bridge, with real audio ────────
  # The one path the control-plane mock can never cover. The mock never dials
  # ws_uri, so the existing sipp-voice-ai job proves siphon composed the right
  # command and stops there. Here the engine really connects to an AI server,
  # SIPp really sends G.711, and the AI server asserts the audio arrived —
  # correct frame geometry for the negotiated ptime, and not digital silence.
  # A bridge that connects and passes zeros is indistinguishable from a working
  # one until you measure the samples, which is what mock_ai_ws.py does.
  sipp-voice-ai-real:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start the real engine + AI server + siphon
        run: docker compose -f sipp/docker-compose.yaml --profile voice-ai-real up -d --wait siphon-rtp-engine mock-ai-ws siphon-voice-ai-real

      - name: Voice-AI call with real RTP (answer_local → WS bridge → audio)
        run: docker compose -f sipp/docker-compose.yaml --profile voice-ai-real up --abort-on-container-exit --exit-code-from sipp-voice-ai-real-uac sipp-voice-ai-real-uac

      - name: Assert audio crossed the bridge in both directions
        # Reads the AI server's AI-WS-VERDICT line. A verdict that never appears
        # is a failure too — that is what a bridge which was never dialled looks
        # like, and it would otherwise pass by absence.
        run: |
          docker compose -f sipp/docker-compose.yaml logs mock-ai-ws > mock-ai-ws.log 2>&1
          docker run --rm -i -v "$PWD/sipp:/app:ro" python:3.12-slim \
            python3 /app/assert_media.py ws --min-sessions 1 --min-downlink 1 < mock-ai-ws.log

      - name: Assert the engine tore the call down cleanly
        # answer_local bumps no offer/answer counter, so only the delete and the
        # error/session floors are meaningful for this flow.
        run: |
          docker run --rm --network sipp_sipnet -v "$PWD/sipp:/app:ro" python:3.12-slim \
            python3 /app/assert_media.py metrics \
              --url http://172.20.0.130:9091/metrics \
              --min-deletes 1 --max-control-errors 0 --max-sessions 0

      - name: Collect logs
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs siphon-voice-ai-real > siphon-voice-ai-real.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs siphon-rtp-engine > siphon-rtp-engine-voice-ai.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs mock-ai-ws > mock-ai-ws.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile voice-ai-real down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-voice-ai-real-logs
          path: |
            siphon-voice-ai-real.log
            siphon-rtp-engine-voice-ai.log
            mock-ai-ws.log
            *.log


  # ── rtpengine mock proxy test (previously not run anywhere) ────────────
  # The `rtpengine` compose profile has existed for a long time and no CI job
  # ever started it, so the mock rtpengine client path was dark. It costs one
  # job to close that, and it is the mock counterpart of sipp-rtpengine-real
  # below in the same way sipp-rtpproxy is of sipp-rtpproxy-real.
  sipp-rtpengine:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start mock rtpengine + siphon
        run: docker compose -f sipp/docker-compose.yaml --profile rtpengine up -d --wait mock-rtpengine siphon-rtpengine

      - name: Register bob
        run: docker compose -f sipp/docker-compose.yaml --profile rtpengine run --rm sipp-rtpengine-register

      - name: Anchored call through the mock
        run: docker compose -f sipp/docker-compose.yaml --profile rtpengine up --abort-on-container-exit --exit-code-from sipp-rtpengine-uac sipp-rtpengine-uac sipp-rtpengine-uas

      - name: Collect logs
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs siphon-rtpengine > siphon-rtpengine.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs mock-rtpengine > mock-rtpengine.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile rtpengine down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-rtpengine-logs
          path: |
            siphon-rtpengine.log
            mock-rtpengine.log

  # ── REAL rtpengine proxy anchoring ─────────────────────────────────────
  # Same script and scenarios as sipp-siphon-rtp-native / -ng, against
  # drachtio/rtpengine. With all three green the media-backend matrix is
  # symmetric: every backend siphon ships is driven by a real engine, and a
  # behavioural difference between the jobs is attributable to the engine.
  sipp-rtpengine-real:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start real rtpengine + siphon
        run: docker compose -f sipp/docker-compose.yaml --profile rtpengine-real up -d --wait rtpengine-real siphon-rtpengine-real

      - name: Register bob
        run: docker compose -f sipp/docker-compose.yaml --profile rtpengine-real run --rm sipp-rtpengine-real-register

      - name: Anchored call (INVITE → offer → 200 → answer → BYE → delete)
        run: docker compose -f sipp/docker-compose.yaml --profile rtpengine-real up --abort-on-container-exit --exit-code-from sipp-rtpengine-real-uac sipp-rtpengine-real-uac sipp-rtpengine-real-uas

      - name: Assert the engine accepted every command
        run: |
          docker run --rm --network sipp_sipnet -v "$PWD/sipp:/app:ro" python:3.12-slim \
            python3 /app/assert_media.py ng --address 172.20.0.44:22222 \
              --min-sessions 1 --max-rejected 0 --max-live 0

      - name: Collect logs
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs siphon-rtpengine-real > siphon-rtpengine-real.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs rtpengine-real > rtpengine-real.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile rtpengine-real down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-rtpengine-real-logs
          path: |
            siphon-rtpengine-real.log
            rtpengine-real.log

  # ── REAL rtpproxy proxy anchoring ──────────────────────────────────────
  # The last backend that had only a mock. rtpproxy exposes no metrics
  # endpoint, so the oracle is its own `I` counters: sessions created proves
  # it did the work, active sessions back at 0 proves siphon sent the delete.
  sipp-rtpproxy-real:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7

      - name: Load the siphon image
        uses: ./.github/actions/load-siphon-image

      - name: Start real rtpproxy + siphon
        run: docker compose -f sipp/docker-compose.yaml --profile rtpproxy-real up -d --wait rtpproxy-real siphon-rtpproxy-real

      - name: Register bob
        run: docker compose -f sipp/docker-compose.yaml --profile rtpproxy-real run --rm sipp-rtpproxy-real-register

      - name: Anchored call (INVITE → U → 200 → L → BYE → D)
        run: docker compose -f sipp/docker-compose.yaml --profile rtpproxy-real up --abort-on-container-exit --exit-code-from sipp-rtpproxy-real-uac sipp-rtpproxy-real-uac sipp-rtpproxy-real-uas

      - name: Assert the relay ran the session and released it
        run: |
          docker run --rm --network sipp_sipnet -v "$PWD/sipp:/app:ro" python:3.12-slim \
            python3 /app/assert_media.py rtpproxy --address 172.20.0.144:22222 \
              --min-sessions 1 --max-active 0

      - name: Collect logs
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs siphon-rtpproxy-real > siphon-rtpproxy-real.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs rtpproxy-real > rtpproxy-real.log 2>&1 || true

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile rtpproxy-real down --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-rtpproxy-real-logs
          path: |
            siphon-rtpproxy-real.log
            rtpproxy-real.log

  # ── A media failure at answer must fail the call, not connect and bill it ──
  # @b2bua.on_answer is where the media backend is driven, so an answer the
  # engine refuses surfaces there — and it surfaces BEFORE the A-leg 2xx is
  # sent. Swallowing it answered the caller anyway and started the charging
  # clock on a call with no media path in either direction, which then billed
  # until the far end gave up. Deterministic and needs no capability: the B-leg
  # answers for real, the handler fails, and both peers assert what they get —
  # the caller demands a 500 (never a 2xx) and the answered callee demands the
  # ACK *and* the BYE, so a run that leaves the callee's dialog established
  # times out rather than passing quietly. Runs the binary natively rather than
  # through compose because the scenario needs no second downstream.
  sipp-b2bua-answer-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.14 (free-threaded)
        uses: deadsnakes/action@v3.2.0
        with:
          python-version: "3.14-dev"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install SIPp
        run: sudo apt-get update && sudo apt-get install -y sip-tester

      - name: Build siphon
        run: PYO3_PYTHON=python3.14 cargo build --bin siphon

      - name: A raised handler and call.terminate() must both fail the call
        run: MODE=both PYO3_PYTHON=python3.14 scripts/b2bua_answer_fail_test.sh

  # An answered call has to be able to end on siphon's own clock. `timeout=`
  # bounds the ring and stops mattering at the 200 OK, so before max_duration an
  # answered call was bounded by nothing but a peer BYE or a session timer —
  # a carrier leg that went quiet with its dialog up held a call actor, a media
  # anchor and a charging session until the process restarted. Deterministic and
  # needs no capability: neither SIPp peer ever hangs up in the capped arms, so
  # the BYE they both wait for can only be the cap, and each asserts it carries
  # RFC 3326 Q.850;cause=102. The opt-out arm is the one that keeps the other two
  # honest — a cap applied unconditionally would pass them both.
  sipp-b2bua-max-duration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.14 (free-threaded)
        uses: deadsnakes/action@v3.2.0
        with:
          python-version: "3.14-dev"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install SIPp
        run: sudo apt-get update && sudo apt-get install -y sip-tester

      - name: Build siphon
        run: PYO3_PYTHON=python3.14 cargo build --bin siphon

      - name: A call must be cut at its maximum duration, and only then
        run: PYO3_PYTHON=python3.14 scripts/b2bua_max_duration_test.sh

  # ── Fuzz testing (nightly) ─────────────────────────────────────────────
  fuzz:
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.14 (free-threaded)
        uses: deadsnakes/action@v3.2.0
        with:
          python-version: "3.14-dev"

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzz target — SIP parser (60s)
        run: PYO3_PYTHON=python3.14 cargo +nightly fuzz run sip_parser_fuzz -- -max_total_time=60

      - name: Run fuzz target — stream framing (60s)
        run: PYO3_PYTHON=python3.14 cargo +nightly fuzz run stream_framing_fuzz -- -max_total_time=60

      - name: Run fuzz target — framer/parser agreement (60s)
        run: PYO3_PYTHON=python3.14 cargo +nightly fuzz run framing_parser_agreement_fuzz -- -max_total_time=60

  # ── SIPp IPsec VoLTE test (self-hosted) ────────────────────────────────
  # IPsec XFRM SA installation needs CAP_NET_ADMIN, which GitHub-hosted runners
  # don't grant. Runs on the self-hosted `ipsec` runner (real xfrm) on trusted
  # triggers only — pushes to trunk and manual dispatch, never fork PRs — so
  # untrusted code can't reach the privileged box. The ipsec logic is also
  # covered by the unit tests in rust-tests.
  sipp-ipsec:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, linux, x64, ipsec]
    needs: rust-tests
    steps:
      - uses: actions/checkout@v7

      # The ipsec runner is self-hosted and persistent — a stale container from
      # a previous run (started with an older image/config, e.g. before the
      # config had ipsec.path_host) would otherwise be reused by `up`, since the
      # profiled services survive a bare `down`. Nuke them first.
      - name: Reset stale test containers
        run: docker compose -f sipp/docker-compose.yaml --profile ipsec down -v --remove-orphans || true

      - name: Build siphon and sipp-ipsec images
        run: |
          docker compose -f sipp/docker-compose.yaml build siphon
          docker compose -f sipp/docker-compose.yaml --profile ipsec build sipp-ipsec

      - name: Start P-CSCF + S-CSCF
        run: docker compose -f sipp/docker-compose.yaml --profile ipsec up -d --wait --force-recreate siphon-ipsec

      - name: SIPp IPsec VoLTE registration
        run: docker compose -f sipp/docker-compose.yaml --profile ipsec run --rm sipp-ipsec

      - name: Collect logs
        if: always()
        run: |
          docker compose -f sipp/docker-compose.yaml logs siphon-ipsec > siphon-ipsec.log 2>&1 || true
          docker compose -f sipp/docker-compose.yaml logs siphon-scscf > siphon-scscf.log 2>&1 || true
          echo "::group::P-CSCF (siphon-ipsec) log"; cat siphon-ipsec.log || true; echo "::endgroup::"
          echo "::group::S-CSCF (siphon-scscf) log"; cat siphon-scscf.log || true; echo "::endgroup::"

      # SIPp exiting 0 does not prove IPsec ran. This job used to pass with no
      # SA ever installed: the 401 carried no ck/ik and every REGISTER went out
      # on the plain port. The P-CSCF activating the SAs is the proof.
      - name: Assert the P-CSCF activated the IPsec SAs
        run: |
          if ! grep -q "ipsec.PendingSA: activated" siphon-ipsec.log; then
            echo "::error::the P-CSCF never activated an IPsec SA, so the protected path did not run"
            exit 1
          fi

      - name: Teardown
        if: always()
        run: docker compose -f sipp/docker-compose.yaml --profile ipsec down -v --remove-orphans

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sipp-ipsec-logs
          path: |
            siphon-ipsec.log
            *.log

  # ── nftables kernel-firewall live test (self-hosted) ───────────────────
  # The nf_tables netlink marshalling is validated end-to-end against a real
  # kernel — the only coverage for the chain/rule/expression builders that a
  # byte-layout test can't fully prove (it caught the big-endian-integer,
  # NFTA_SET_KEY_TYPE, and multi-ack bugs during development). Needs
  # CAP_NET_ADMIN, which GitHub-hosted runners don't grant, so it shares the
  # self-hosted `ipsec` runner on trusted triggers only (trunk push + manual
  # dispatch, never fork PRs). The test runs inside a throwaway user+net
  # namespace (`unshare -rn`): the fresh netns gives it an isolated nft ruleset
  # so it touches nothing on the host and cleans up when the namespace exits,
  # and the user-namespace root map supplies CAP_NET_ADMIN without real
  # privilege. Host prerequisites on the runner: the `nft` binary and
  # unprivileged user namespaces enabled (user.max_user_namespaces > 0).
  nftables-firewall:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, linux, x64, ipsec]
    needs: rust-tests
    steps:
      - uses: actions/checkout@v7

      - name: Install Python 3.14 (free-threaded)
        uses: deadsnakes/action@v3.2.0
        with:
          python-version: "3.14-dev"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Build the test binary WITH network, OUTSIDE the namespace, so the
      # network-isolated `unshare -n` run below never needs to fetch or compile.
      - name: Build the firewall live test
        run: PYO3_PYTHON=python3.14 cargo test --lib --no-run firewall::nftables

      - name: nftables live-kernel roundtrip (isolated user+net namespace)
        run: unshare -rn env PYO3_PYTHON=python3.14 cargo test --lib firewall::nftables::tests::live_kernel_roundtrip -- --ignored --nocapture
