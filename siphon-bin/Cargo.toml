[package]
name = "siphon-bin"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "SIPhon binary with opt-in, feature-gated extension modules (SMPP, HTTP, SIGTRAN, …)"
# Built from source by operators who want extensions. The plain `siphon` binary
# ships from the `siphon-sip` crate (`cargo install siphon-sip`); this package is
# a superset that composes optional extension crates behind cargo features.
publish = false

[[bin]]
# SAME artifact name as siphon-sip's binary on purpose: an operator who wants
# extensions builds this package instead, producing a drop-in `siphon` binary.
# Because this is a separate, excluded workspace, a root `cargo build` in the
# siphon-sip repo never builds it — so the Dockerfile / cargo-deb / release
# machinery for the plain binary is unaffected.
name = "siphon"
path = "src/main.rs"

[features]
# HTTP is on by default. It is the one module with no deployment prerequisite —
# no libsctp, no upstream SMSC bind, nothing to provision — and the one most
# scripts reach for (webhooks in, `http.Client` out). A build of *this* package
# with no extensions at all is just the plain `siphon` binary, which anyone can
# get from `cargo install siphon-sip`, so an empty default made the package
# pointless out of the box. Opt out with `--no-default-features`.
default = ["http"]
# Every other module is opt-in. With a module's feature disabled, an
# `extensions.<name>` block in siphon.yaml still parses and is skipped with a
# loud warning (mirrors the siphon `sctp` feature contract).
smpp = ["dep:siphon-smpp"] # SMPP 3.4 — inbound/outbound binds, scriptable `smpp` namespace
http = ["dep:siphon-http"] # HTTP/HTTPS — inbound routes + Rust-backed `http.Client`, scriptable `http` namespace
# SIGTRAN/SS7 — M3UA/M2PA/SUA transport over SCTP, MTP3 routing, SCCP GTT,
# MAP/CAP/INAP dialogue termination; scriptable `ss7` / `gsm_map` / `gsm_cap` /
# `inap` namespaces. Needs libsctp at build + runtime (async-sctp links it).
sigtran = ["dep:siphon-sigtran"]
full = ["smpp", "http", "sigtran"] # convenience aggregate: every extension module

# Passthroughs to siphon-sip's own optional features. Not extension modules —
# they gate functionality inside the lib, and without a passthrough here there
# is no way to turn them on from a siphon-bin build at all. Deliberately kept
# out of `default` and out of `full` (which is the *extension* aggregate): the
# official artifacts pass `--features ui` explicitly.
ui = ["siphon-sip/ui"] # embedded operator web dashboard, served behind `admin.ui.enabled`
sctp = ["siphon-sip/sctp"] # SIP + Diameter over SCTP; needs libsctp at build + runtime

[dependencies]
# Single-source rule: every crate here that depends on siphon-sip MUST use a
# byte-identical git URL + ref, or cargo keys two separate `siphon-sip` sources
# (it does NOT follow GitHub's repo-rename redirect) and the builder closures
# fail to type-match. siphon-smpp v1.4.0 pins
# `siphon-sip = { git = ".../siphon-sip", branch = "main" }`, so siphon-sip stays
# on `branch = "main"` here too; the committed Cargo.lock pins the exact SHA for
# reproducible builds (advance with `cargo update`). Extension crates themselves
# are pinned to their released tags for stable, intentional bumps.
siphon-sip = { git = "https://github.com/siphon-project/siphon-sip", branch = "main" }
siphon-smpp = { git = "https://github.com/siphon-project/siphon-smpp", tag = "v1.5.1", optional = true }
siphon-http = { git = "https://github.com/siphon-project/siphon-http", tag = "v1.0.2", optional = true }
# siphon-sigtran keeps its siphon-sip face behind its own `python` feature (its
# default build pulls neither pyo3 nor siphon), so the composing binary asks for
# it explicitly. Its pyo3 pin tracks siphon-sip's — both link the `python` native
# library and cargo allows one version of a `links` crate per graph.
siphon-sigtran = { git = "https://github.com/siphon-project/siphon-sigtran", tag = "v1.0.0", optional = true, features = ["python"] }

clap = { version = "4", features = ["derive"] }
# No `tracing` dep: this package's only code runs at builder time, before
# SiphonServer::run() installs the subscriber, so its diagnostics go to stderr
# (see src/ext/mod.rs::startup_diagnostic). Everything after that point is
# siphon-sip's own instrumented code.
# jemalloc is installed in main.rs via `siphon::install_allocator!()`, which
# re-exports siphon's own tikv-jemallocator — so there is no jemalloc dependency
# to declare here (avoids `links = "jemalloc"` version skew with siphon-sip).

# Standalone workspace so this package is never swept into the siphon-sip
# package and its dependency graph stays independent.
[workspace]
