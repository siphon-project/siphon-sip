# Clippy configuration for SIPhon.
#
# too-many-arguments-threshold: SIP / IMS / Diameter handlers legitimately
# carry many protocol fields (AVPs, headers, transport coordinates), so the
# default threshold of 7 produced ~70 false positives. Raise it to 12 — the
# widest signature in the tree today (siprec start_recording) — so the lint
# still flags genuinely-egregious signatures (13+) while accepting the
# domain's inherently-wide protocol functions. This replaces the scattered
# per-function `#[allow(clippy::too_many_arguments)]` attributes.
too-many-arguments-threshold = 12

# too-many-lines-threshold: the rule that would actually have prevented
# dispatcher.rs. That file did not grow by adding functions, it grew by adding
# to them — handle_b2bua_response passed 500 lines long before the file passed
# 10,000, and no file-size gate catches that.
#
# 300 is where a match with a dozen arms still reads top to bottom. Twelve
# functions exceed it today and each carries an #[allow] naming why: ten are in
# dispatcher.rs and one is server.rs::run_async, all decomposed by the 1.9.0
# module split, and the twelfth is metrics::SiphonMetrics::new, a flat table of
# one registration per metric and a permanent exemption for the same reason its
# file is on the size allowlist.
#
# scripts/check_too_many_lines_allows.py pins that count so it can only fall.
too-many-lines-threshold = 300

# disallowed-methods: waits that park the calling thread. On a thread attached
# to the interpreter (a script API, a handler's continuation, an extension
# callback) any of them holds a garbage collection's stop-the-world open for as
# long as it waits, and a wait that needs tokio to finish never ends. Each wait
# goes through `crate::script::blocking` (`released` / `blocking_released` /
# `block_on_released`, which release the interpreter when the thread holds it),
# or runs on a dedicated thread that never attaches. An exception is an
# `#[allow(clippy::disallowed_methods)]` with the reason beside it;
# `scripts/check_disallowed_methods_allows.py` pins how many there are.
disallowed-methods = [
  { path = "tokio::runtime::Handle::block_on", reason = "parks the thread; use crate::script::blocking::block_on_released" },
  { path = "tokio::runtime::Runtime::block_on", reason = "parks the thread; startup only" },
  { path = "tokio::task::block_in_place", reason = "use crate::script::blocking::blocking_released" },
  { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "blocking getaddrinfo; resolve with SipResolver or wrap in blocking_released" },
  { path = "std::net::TcpStream::connect", reason = "blocking connect; use tokio, or wrap in blocking_released" },
  { path = "std::net::TcpStream::connect_timeout", reason = "blocking connect; use tokio, or wrap in blocking_released" },
  { path = "std::thread::sleep", reason = "parks the thread; tokio::time::sleep, or a dedicated thread that never attaches" },
  { path = "tokio::sync::mpsc::Receiver::blocking_recv", reason = "parks the thread; await it, or wrap in blocking_released" },
  { path = "tokio::sync::mpsc::UnboundedReceiver::blocking_recv", reason = "parks the thread; await it, or wrap in blocking_released" },
  { path = "tokio::sync::oneshot::Receiver::blocking_recv", reason = "parks the thread; await it, or wrap in blocking_released" },
]
