<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIPhon — Control</title>
<!-- Inline so the shell needs no extra request and the browser stops asking for
     /favicon.ico, which the asset handler correctly 404s. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath d='M120 300V120C120 70 170 50 256 50s136 20 136 70v220' stroke='%230ea5e9' stroke-width='40' fill='none' stroke-linecap='round'/%3E%3Crect x='60' y='260' width='120' height='190' rx='16' fill='%236366f1'/%3E%3Crect x='332' y='320' width='120' height='130' rx='16' fill='%2322d3ee'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 512 512" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="tube" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0ea5e9"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
          <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.6"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0.3"/></linearGradient>
          <linearGradient id="packet" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
        </defs>
        <rect x="60" y="200" width="120" height="220" rx="10" stroke="url(#tube)" stroke-width="14" fill="none"/>
        <rect x="70" y="266" width="100" height="145" rx="8" fill="url(#liquid)"/>
        <rect x="332" y="280" width="120" height="140" rx="10" stroke="url(#tube)" stroke-width="14" fill="none"/>
        <rect x="342" y="342" width="100" height="70" rx="8" fill="url(#liquid)"/>
        <path d="M 120 260 L 120 120 C 120 70, 170 50, 256 50 C 342 50, 392 70, 392 120 L 392 340" stroke="url(#tube)" stroke-width="18" stroke-linecap="round" fill="none"/>
        <g>
          <rect x="-8" y="-6" width="18" height="12" rx="3" fill="url(#packet)"><animateMotion dur="3s" repeatCount="indefinite" rotate="auto" path="M 120 260 L 120 120 C 120 70, 170 50, 256 50 C 342 50, 392 70, 392 120 L 392 340"/></rect>
          <rect x="-8" y="-6" width="18" height="12" rx="3" fill="url(#packet)" opacity="0.6"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" rotate="auto" path="M 120 260 L 120 120 C 120 70, 170 50, 256 50 C 342 50, 392 70, 392 120 L 392 340"/></rect>
        </g>
      </svg>
      <div><span class="word">SIP<b>hon</b></span><span class="tag">control</span></div>
    </div>

    <nav id="nav">
      <div class="lbl">Traffic</div>
      <a class="navitem active" data-view="overview">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Overview
      </a>
      <a class="navitem" data-view="calls">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M4 5c0 9 6 15 15 15a1.5 1.5 0 001.5-1.5v-2.6a1 1 0 00-.8-1L16 13.5a1 1 0 00-1 .4l-.9 1.2a12 12 0 01-4.7-4.7l1.2-.9a1 1 0 00.4-1L9.6 4.3a1 1 0 00-1-.8H6A1.5 1.5 0 004 5z"/></svg>
        Calls <span class="count" id="nav-calls"></span>
      </a>
      <a class="navitem" data-view="registrations">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        Registrations <span class="count" id="nav-regs"></span>
      </a>

      <div class="lbl">Routing</div>
      <a class="navitem" data-view="gateways">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/><path d="M7.5 7h.01M7.5 17h.01"/></svg>
        Gateways <span class="count" id="nav-gw"></span>
      </a>
      <a class="navitem" data-view="signalling">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
        Signalling <span class="count"></span>
      </a>
      <a class="navitem" data-view="media">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>
        Media <span class="count"></span>
      </a>
      <a class="navitem" data-view="control">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 6H18M6 8.5V15a3 3 0 003 3h6"/></svg>
        Control <span class="count"></span>
      </a>

      <div class="lbl">Node</div>
      <a class="navitem" data-view="security">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/></svg>
        Security <span class="count" id="nav-bans"></span>
      </a>
      <a class="navitem" data-view="system">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg>
        System
      </a>
      <a class="navitem" data-view="cost">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M14.5 9.5a2.5 2.5 0 00-2.5-1.5c-1.4 0-2.5.7-2.5 2s1.1 1.7 2.5 2 2.5.7 2.5 2-1.1 2-2.5 2a2.5 2.5 0 01-2.5-1.5M12 6.5v11"/></svg>
        Cost <span class="count"></span>
      </a>
      <a class="navitem" data-view="logs">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M5 4h9l5 5v11a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1z"/><path d="M14 4v5h5M8 13h8M8 17h5"/></svg>
        Logs <span class="count"></span>
      </a>
    </nav>

    <div class="sidefoot">
      <span id="foot-node">● connecting…</span>
      <span id="foot-ver">siphon</span>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="iconbtn navtoggle" id="navtoggle" title="Menu" aria-label="Open navigation" aria-expanded="false">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="crumb" id="crumb">Overview</div>
      <span class="badge warn" title="The web dashboard is an experimental feature and may change">experimental</span>
      <div class="spacer"></div>
      <span class="topsearch">
        <input id="topsearch" type="search" placeholder="Find a call: number, call-id…" autocomplete="off">
      </span>
      <div class="badges">
        <span class="badge" id="b-live"><span class="led"></span>LIVE</span>
        <span class="badge" id="b-ready"><span class="led"></span>READY</span>
        <span class="badge" id="b-jem"><span class="led"></span>jemalloc</span>
        <span class="badge mono" id="b-up">up —</span>
      </div>
      <button class="unlock" id="unlock" title="Enter an admin token to enable write actions">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0"/></svg>
        <span id="unlock-t">Unlock</span>
      </button>
      <button class="iconbtn" id="theme" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M21 12.8A8.5 8.5 0 1111.2 3a6.6 6.6 0 009.8 9.8z"/></svg>
      </button>
    </header>

    <div class="content" id="views"></div>
  </div>
</div>

<div class="navbackdrop" id="navbackdrop"></div>
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="drawer" id="drawer" aria-live="polite">
  <header>
    <span class="t" id="drawer-title">Detail</span>
    <span class="spacer"></span>
    <button class="iconbtn" id="drawer-close" title="Close" aria-label="Close">
      <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="body" id="drawer-body"></div>
</aside>

<div class="toast" id="toast"><span class="di"></span><span id="toast-t">Done</span></div>

<script type="module" src="/app.js"></script>
</body>
</html>
